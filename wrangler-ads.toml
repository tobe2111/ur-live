# ============================================================
# 유어애즈 독립 Worker (ur-ads) — 설계: docs/design/urads-worker-split.md
#
# ⚠️ 이것은 **표준(standalone) Worker** 설정입니다 (메인 wrangler.toml 은 Pages).
#   배포: `npx wrangler@3 deploy --config wrangler-ads.toml`
#   메인 Pages(ur-live)와 **같은 D1** 을 바인딩 → 3서비스 데이터 연결 유지.
#   ⚠️ 이 Worker 에는 Custom Domain 을 붙이지 않는다(2026-04-22 사고 방지). Service Binding 으로만 접근.
#
#   Phase A: 스캐폴드(미배포). Phase B 에서 대표가 Cloudflare 셋업 후 이 설정으로 배포.
# ============================================================

name = "ur-ads"
main = "dist-ads/index.js"
# 🔒 2026-07-23 전수조사: workers.dev 라우트 비활성 — /__ads/*(무인증 수집 트리거·self-chain·시트 rewrite)가
#   공개 도달 가능하던 표면 봉인. 접근은 Service Binding(메인 env.ADS·자기 SELF)으로만(바인딩은 라우트 불필요).
workers_dev = false
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# 🚨 2026-07-20 실사고 재발 방지: 대시보드에서 넣은 **일반 텍스트(plaintext) Variables** 는
#   `wrangler deploy` 가 이 toml 의 [vars] 로 통째 교체하며 **삭제**한다(Secret 타입만 생존).
#   Phase B 에서 대표가 넣은 JWT_SECRET/YOUTUBE_API_KEY/NAVER_* 가 CI 배포마다 wipe →
#   유어애즈 로그인 "서버 설정 오류(JWT_SECRET)" + 인플루언서 수집 0건.
#   keep_vars = true → 대시보드 설정 변수를 배포가 보존. (신규 값은 가급적 Secret 타입으로.)
keep_vars = true

# 배포 전 esbuild 번들(@/ alias resolve) — wrangler deploy 가 이 command 를 먼저 실행.
[build]
command = "node scripts/build-worker-ads.js"

# ⏰ Cron — 소셜 홍보 자동화(메인에서 이관). 전부 게이트 OFF 기본이라 미설정 시 no-op.
#   매시간: 영상 렌더 폴링 + 예약 발행(SOCIAL_AUTO_PUBLISH_ENABLED). 주간(월): 홍보 초안(SOCIAL_AUTO_DRAFT_ENABLED).
[triggers]
# ⚠️ 2026-07-20: Cloudflare **계정 전체 cron 5개 한도**(code 10072) — ur-ads 4개 등록이 통째 거부돼
#   자동수집/일일배치가 전혀 안 돌았음. **cron 1개로 통합**(scheduled 핸들러가 event.scheduledTime 시각/요일
#   분기로 매시간/일일18시/주간월요일 처리). autobid "*/5" 는 매시간 게이트 뒤로 흡수. 계정 slot 부담 4→1.
crons = ["0 * * * *"]

# 같은 D1 (메인 ur-live 와 동일 database_id — 데이터 공유의 핵심)
[[d1_databases]]
binding = "DB"
database_name = "toss-live-commerce-db"
database_id = "d9530ba6-7a26-4c02-9295-3ce5aef112a3"

# 📣 **유어애즈 발굴 리드 전용 D1** (2026-08-19) — 716,203행 이사 완료 후 선언.
#
#   🔴 대시보드에만 붙이면 **다음 `wrangler deploy` 가 지운다.** 이 파일이 선언한 것으로 워커 설정을
#      통째로 교체하기 때문이다 — 여기 없으면 "추가 안 함"이 아니라 **삭제**다.
#      위 BACKUP_BUCKET 주석의 2026-08-02 실측이 정확히 그 사고다(백업 cron 을 켠 배포가
#      백업이 쓸 버킷을 지웠다). 같은 실수를 이 바인딩으로 반복하지 말 것.
#
#   왜 나누나: 수집 리드가 결제와 같은 D1 에 쌓여 494 MB(무료 한도 500 MB의 99%)에 닿았다.
#      실데이터의 92%가 수집분이고 최근 7일 증가는 유어애즈 +123,368행 / 그 외 +179행.
#      한도에 닿으면 주문·결제 쓰기까지 같이 죽는다. 설계: docs/design/ads-leads-db-split.md
#
#   미선언 상태는 **안전하다** — `adsLeadsDb()` 가 바인딩이 없으면 `DB` 를 그대로 쓴다(현행 동일).
#
[[d1_databases]]
binding = "ADS_DB"
database_name = "urads-leads-db"
database_id = "d4630482-b97e-4e96-bb96-abde4ef8cc95"


# ⏰ **DO 알람 레인** (2026-08-02) — cron 부모의 CPU 천장을 우회하는 유일한 무료 경로.
#   부모가 `SELF.fetch` 로 띄운 자식의 CPU 는 **호출자 몫에서 나가서**, 부모가 3.6초에 죽으며
#   매 정각 레인 절반이 끌려갔다(실측: 8개 중 4 사망 · 6개로 줄여도 3 사망 — 비율 그대로).
#   DO 알람은 **부모가 없다** — 예약 시각에 런타임이 독립 인보케이션으로 깨우므로 자기 CPU·서브리퀘스트를
#   그대로 받고, 알람 안에서 다음 알람을 걸어 스스로 이어진다.
#   🆓 `new_sqlite_classes` = 무료 플랜 호환 백엔드(메인 ur-live 가 이미 같은 방식으로 DO 2개 운영 중).
#   🔻 롤백: env `ADS_LANE_ALARM_ENABLED='false'` → 체인이 멎고 cron 경로로 자동 복귀(코드 변경 0).
[[durable_objects.bindings]]
name = "ADS_LANE"
class_name = "AdsLaneDurableObject"

[[migrations]]
tag = "v1-ads-lane"
new_sqlite_classes = ["AdsLaneDurableObject"]

# 🔁 자기참조 서비스바인딩 — YT 예산 버스트 self-chain(각 수집 인보케이션이 다음을 fresh 예산으로 던지고 즉시 종료).
#   Custom Domain 아님(2026-04-22 사고 무관) — 워커 내부 바인딩. wrangler deploy 가 toml 로 자동 생성(대시보드 불필요).
[[services]]
binding = "SELF"
service = "ur-ads"

# KV (있으면 메인과 동일 namespace 를 대시보드 Bindings 에 등록):
#   RATE_LIMIT_KV · SESSION_KV · CACHE_KV
#
# 시크릿 (대시보드 Settings → Variables and Secrets, 메인과 동일 값):
#   JWT_SECRET(필수·동일) · YOUTUBE_API_KEY · NAVER_SEARCH_CLIENT_ID/SECRET(또는 NAVER_CLIENT_ID/SECRET)
#   · DATA_ENCRYPTION_KEY · ANTHROPIC_API_KEY · ADS_* 플래그 · RESEND_*(선택)
