# ============================================================
# Cloudflare Pages Configuration
#
# ⚠️ 이 프로젝트는 Cloudflare Pages (with _worker.js advanced routing) 입니다.
# - 배포 명령: `npx wrangler@3 pages deploy dist/client --project-name=ur-live`
# - `wrangler deploy` (Workers용) 사용 금지 — 부적합 + 배포 꼬임 유발
# - `live.ur-team.com` Custom Domain 은 Pages 프로젝트 `ur-live`에 연결
# - Secret 관리: Dashboard → Workers & Pages → ur-live (Pages) → Settings → Secrets
#
# 2026-04-22 사고 기록:
# Workers 프로젝트가 Custom Domain을 가로채 secret 없이 동작 → 로그인 500 이틀 지속.
# 상세는 CLAUDE.md "2026-04-22 사고 요약" 참조.
# ============================================================

name = "ur-live"
main = "src/worker/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# 🛠️ 2026-07-18: 빌드 상수 define — worker-deploy(cron 워커, `wrangler deploy`) 배선 수리.
#   Pages 경로는 scripts/build-worker.js 의 esbuild define 이 __INCLUDE_* 를 치환하지만,
#   cron 워커는 wrangler 자체 번들이라 미정의 → `ReferenceError: __INCLUDE_DOCS__ is not defined`
#   (upload validation 10021)로 worker-deploy 가 깨졌었음(docs-DCE 2026-07-16 이후).
#   cron 워커는 fetch 라우트 소비자가 아니므로 둘 다 false(=Pages 소비자 빌드와 동일 DCE).
#   ⚠️ 새 __INCLUDE_* 빌드 상수를 추가하면 build-worker.js 와 여기 **둘 다** 등록할 것.
[define]
__INCLUDE_WHOLESALE__ = "false"
__INCLUDE_DOCS__ = "false"

# Build command: Cloudflare Workers CI가 빌드 전 프론트엔드를 생성하도록
[build]
command = "npm run build"

# Static assets (React SPA)
[assets]
directory = "./dist/client"

# ============================================================
# D1 Database
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "toss-live-commerce-db"
database_id = "d9530ba6-7a26-4c02-9295-3ce5aef112a3"

# ============================================================
# KV Namespaces — 🚨 운영 필수 (DDoS / brute-force 방어)
# ============================================================
# 이 파일에 id 가 비어있어도 Pages 배포는 통과하지만,
# Cloudflare Dashboard → Workers & Pages → ur-live (Pages) → Settings → Bindings
# 에 RATE_LIMIT_KV / SESSION_KV namespace 가 등록되어야 production rate limit 작동.
#
# 미등록 시 영향 (src/worker/middleware/rate-limiter.ts:90 참조):
#   - 비-인증 라우트: rate limit 무력화 (fail-OPEN, 콘솔 경고)
#   - 인증 라우트 (login/refresh 등): fail-CLOSED → 일시적 모든 요청 429
#
# 확인 방법:
#   curl -I https://live.ur-team.com/api/products
#   → X-RateLimit-Limit / X-RateLimit-Remaining 헤더 있어야 정상
#
# 등록 방법 (CLI):
#   wrangler kv:namespace create RATE_LIMIT_KV
#   wrangler kv:namespace create SESSION_KV
#   → 출력된 id 를 Dashboard Bindings 에 등록 (또는 아래 주석 풀어서 사용)
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# [[kv_namespaces]]
# binding = "SESSION_KV"
# id = "YOUR_SESSION_KV_ID"

# 🛡️ 2026-05-23 (Task 2): CACHE_KV — public API 응답 second-layer cache (L2).
#   Edge cache (L1) 는 PoP 별 격리 — 한국 PoP ≠ 일본 PoP 캐시.
#   KV 는 region 간 공유 → 새 region cold start 시 D1 hit 대신 KV hit.
#   미바인딩 시 publicCache 는 자동으로 L1 only mode (graceful degradation).
#
#   Dashboard 등록: Workers & Pages → ur-live → Settings → Bindings → KV → CACHE_KV
#
# 🔴 2026-08-03 — **주석으로 두면 배포가 지운다.** 실측: 대표가 대시보드에서 CACHE_KV 를 이 워커에
#   바인딩했는데(00:31 KST 확인), 그 뒤 `wrangler deploy`(#971, 00:43 KST 완료)가 돌자 사라졌다
#   (바인딩 12개 → 6개). `wrangler deploy` 는 **이 파일이 선언한 것으로 워커 설정을 통째로 교체**한다
#   — 여기 없으면 "추가하지 않는 것"이 아니라 **삭제하는 것**이다. 살아남은 것은 이 파일에 선언된
#   D1·DO·vars 와 **Secret**(별도 저장소라 교체 대상이 아니다) 뿐이었다.
#   ⇒ 값이 비밀이 아닌 바인딩(KV/D1/R2/DO)은 **반드시 이 파일에 선언**한다. 비밀인 값은 반대로
#     절대 여기 쓰지 말고 **Secret 으로** 등록한다(공개 레포 — 쓰면 영구 노출).
#
#   ⚠️ id 주의: 계정에 `CACHE_KV`(25ecc9ce…) 라는 **동명의 다른 네임스페이스**가 있다. Pages 가
#     실제로 읽는 것은 제목이 `ur-cashe` 인 25aef979… 다(오타로 만들어진 이름). SSR 워밍은
#     **cron 이 쓰고 Pages 가 읽는** 구조라 둘이 갈리면 에러 없이 기능만 죽는다 — 이름이 아니라
#     **Pages 바인딩이 가리키는 id** 를 따라간다.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "25aef97917074251aa482f0988be8283"

# ============================================================
# R2 Buckets (D1 백업 + 정산 송장 저장)
# ============================================================
# 활성화: 1) Cloudflare Dashboard → R2 → bucket 'ur-live-backups' 생성
#         2) 아래 3줄 주석 해제 후 wrangler 재배포
#         3) 자동 동작:
#            - 매주 일요일 20:00 UTC: D1 dump → backups/d1-YYYY-MM-DD.sql
#            - 매월 1일 09:00 KST: 정산 송장 → invoices/YYYY-MM/INV-*.html
#         4) (선택) R2 lifecycle: 30일 자동 삭제 설정
#
# 🔴 2026-08-03 — **주석으로 두면 배포가 지운다**(같은 날 CACHE_KV 가 당한 것과 동일 클래스).
#   실측: 대표가 대시보드에서 BACKUP_BUCKET 을 이 워커에 바인딩했는데, 그 뒤 `wrangler deploy`
#   (2026-08-02 15:43Z, 백업 cron 점화 배포)가 돌자 **사라졌다**. `wrangler deploy` 는 이 파일이
#   선언한 것으로 워커 설정을 **통째로 교체**한다 — 여기 없으면 "추가하지 않는 것"이 아니라 **삭제**다.
#   ⇒ 그래서 하필 백업 cron 을 켠 그 배포가 백업이 쓸 버킷을 지웠다. 선언으로 고정한다.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "ur-live-backups"

# 🛡️ 2026-05-18: 미디어 업로드 (사업자등록증 / 숙소 객실 이미지 / 상품 이미지 등).
#   - 셀러 / 어드민 / 사용자가 POST /api/upload/image 호출 시 사용.
#   - Cloudflare Dashboard 에서 R2 bucket 'ur-live-media' 생성 후 binding.
#   - PUBLIC_R2_URL env: 'https://media.ur-team.com' (custom domain) 또는 r2.dev URL.
#   - 🚨 운영 활성화 순서:
#     1) Dashboard R2 → 'ur-live-media' bucket 생성
#     2) Dashboard Pages → ur-live → Settings → Bindings → R2 → MEDIA_BUCKET 등록
#     3) (선택) Custom Domain 연결 → PUBLIC_R2_URL secret 등록
#     4) /api/upload/image 호출 시 fail-soft (bucket 없으면 dataURI fallback 동작 — src/worker/upload.ts)
#
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "ur-live-media"

# ============================================================
# Durable Objects (for live streaming)
# One DO instance per stream — handles WebSocket chat + product/viewer broadcasts
# ============================================================
[durable_objects]
bindings = [
  { name = "LIVE_STREAM", class_name = "LiveStreamDurableObject" },
  { name = "RATE_LIMITER", class_name = "RateLimiterDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveStreamDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiterDurableObject"]

# ============================================================
# Development Variables
# ============================================================
[vars]
# ENVIRONMENT is set via Cloudflare Dashboard
FRONTEND_URL = "https://live.ur-team.com"
SCRAPER_URL = "https://live.ur-team.com"
# REGION is set via Cloudflare Dashboard

# ============================================================
# Cron Triggers (Scheduled Tasks)
# ============================================================
# 5분마다 실행: 만료 정리, 자동 상태 전환, 자동 정산
# - 라이브 30분 미활동 → 자동 종료
# - 미결제 주문 24시간 → 자동 취소 + 재고 복구
# - 공동구매/바우처/경매/타임딜 만료
# - 자동 구매확정 (배송 14일 경과)
# - 오래된 알림/토큰 정리
# - 바우처 자동 정산 (사용 후 7일 경과)
# UTC 18:00 = KST 03:00 daily trigger for settlement
# UTC Monday 00:00 = KST Monday 09:00 — 에이전시 자동 정산 (P0 #3)
[triggers]
# ⚠️⚠️ 이 배열은 **선언이지 현실이 아니다.** (2026-07-29 실측)
#
#   `wrangler deploy` 의 스케줄 PUT 은 **원자적 전체 교체**다 — 배열 하나가 거부되면 전부 반영 안 되고,
#   배열에서 뺀 항목은 **삭제**된다. 그런데 worker-deploy 가 그 실패를 삼켜 성공으로 보고했다.
#   결과: 아래 9개를 선언해 두고도 CF 에 실제 등록된 것은 **3개뿐**이었고, 아무도 몰랐다.
#   (거부 문자열: `0 20 * * 0` — CF 의 day-of-week 는 **1-7 또는 MON-SUN**, 0 은 범위 밖. code 10100)
#
#   ⇒ 그래서 지금은 **실측 등록분과 일치시킨 상태(0단계)** 다. 목적은 단 하나 —
#      `worker-deploy` 가 처음으로 스케줄 PUT 초록불을 찍게 하는 것. 그 초록불 전까지 이후 단계는
#      전부 추정 위에 서 있다. 배열을 늘리는 것은 **점화**이고, 순서·판정 기준은 아래 문서에 있다:
#      docs/design/cron-staged-ignition-plan-2026-07.md  (백업 → 정합/성숙 → 매시간 → 지급 → 나머지)
#
#   ❗ 한 줄 룰: **여기에 한 줄 추가 = 그 블록의 모든 머니 작업이 다음 발화에 처음으로 돈다.**
#      한 번에 한 블록만, 하트비트로 확인하고 다음.
#
# 현재 등록분(= CF 대시보드 Trigger Events 실측 + cron 하트비트 양쪽 일치):
#   */5  — 짧은 cleanup / 재시도 drainer / 피드 캐시 / prewarm
#   0 18 — (KST 03:00) 정산 성숙 · voucher 환불 · 원장 정합 · 일일 진단
#   0 19 — (KST 04:00) reconciliation · influencer-payout
# 🗄️ 2026-08-02 — **주간 D1 백업 점화 완료.** 여기 오기까지 벽이 두 개였고, 두 번째는 첫 번째를
#   고쳐야 보였다. 둘 다 기록해 둔다 — 다음 세션이 같은 순서로 헤매지 않도록.
#
#   ① 문법(code 10100): `0 20 * * 0` — CF 의 day-of-week 는 1-7 또는 MON-SUN 이라 **0 이 범위 밖**.
#      스케줄 PUT 은 **원자적 전체 교체**라 이 한 줄이 배열 전체를 무효화했고, 그래서 백업 cron 은
#      몇 달간 **등록조차 된 적이 없었다**(하트비트 0 · R2 객체 0 · 재해복구 수단 0).
#      → `0 20 * * SUN`. 숫자 대신 이름을 쓴다(0/1 이 일·월 중 뭔지 헷갈릴 여지 제거).
#
#   ② 계정 한도(code 10072): ①을 고쳐 실제 배포하니 나왔다 —
#      "Workers Free limit of **5 cron triggers per account**". 계정이 이미 정확히 5였다.
#      6번째를 넣자 PUT 이 거부되고 **그 뒤 모든 worker-deploy 가 이 단계에서 실패**했다(실측 13:19Z).
#      → 슬롯을 **회수**했다: `ur-live-cleanup-cron`(별도 워커) 삭제.
#         그 워커는 소스가 `archive/dead-code/` 로 옮겨진 지 5개월이고, 하던 일 3개가 전부
#         여기 `*/5` 로 이관됐거나(배송동기화=`syncShippingStatusBatch` · 자동구매확정=§10)
#         엔드포인트가 사라졌다(`/api/cleanup/expired-reservations` → **404 를 5분마다** 호출 중이었다.
#         대시보드 실측 290 requests ≈ 288 = 24h × 12 — 정말로 계속 돌고 있었다).
#      ⇒ 계정 합산: ur-live 4 + ur-ads 1 = **5/5**.
#
#   ⚠️ 아래 배열은 **더하는 게 아니라 통째로 대체**한다. 항목을 빼면 그 cron 은 삭제된다.
#      새 항목을 넣기 전에 ⓐ `worker-deploy` 로그의 `schedule:` 목록과 대조하고
#      ⓑ **계정 합이 5 를 넘지 않는지** 확인할 것 — 둘 다 `check-cron-syntax` 가 자동 검사한다.
#      자리가 더 필요하면 Workers Paid(한도 1,000) 전환.
#
# 🔴 2026-08-02 기록 — **문법이 원인의 전부가 아니었다.** `0 20 * * SUN` 으로 고쳐 배포하자
#   `Workers Free limit of 5 cron triggers per account [code: 10072]` 이 떴다. 한도는
#   **스크립트당이 아니라 계정당**이다. 그때는 무료 유지 결정으로 이 항목을 뺐고,
#   **같은 날 죽은 워커를 정리해 슬롯을 회수하면서 되돌아왔다**(#971).
#   ⚠️ 교훈: 한 원인을 찾고 초록불을 봤다고 다른 원인이 없다는 뜻이 아니다.
#   ⚠️ 주간 지급(`0 0 * * 1`)은 아직 자리 밖이다 — **첫 정산(D+7) 전까지 결정 필요.**
crons = ["*/5 * * * *", "0 18 * * *", "0 19 * * *", "0 20 * * SUN"]
#
# 🔻 아래는 **선언에서 뺀 것이지 폐기한 것이 아니다.** 단계 점화 시 되돌린다(문서의 단계 번호와 1:1).
#   1단계  ✅ **점화됨(2026-08-02)** — 위 배열에 SUN 표기로 포함. 표기를 `0`→`SUN` 으로 교정.
#          ⚠️ `BACKUP_BUCKET` R2 바인딩이 **선행조건**이다. 미바인딩 상태로 회차가 오면
#             `handleD1Backup` 이 throw → `safeCron` 이 `cron_failures` + 어드민 벨에 남긴다.
#             (조용히 실패하지는 않는다 — 오히려 "바인딩 필요"가 화면에 뜬다.) 바인딩만 하면
#             다음 회차부터 재배포 없이 바로 동작한다.
#   2단계  (이미 0 19 포함)
#   3단계  "0 * * * *"      — 매시간: toss 환불 재시도 · **도매 예치금 자동 환불** · webhook drain.
#                             ⚠️ 예치금 규모 미측정 상태로 켜지 말 것.
#   4단계  "0 0 * * 1"      — 주간 payouts-generate(지급 행 생성). **가장 마지막.**
#                             🔴 차단: 원장 receivable 이 `seller:null` 계정에 잡혀 있다 — 정체 규명 전 금지.
#   5단계  "0 9 * * *"      — 만료·리마인더 알림 8종 (비-머니)
#          "0 3 * * *"      — 카탈로그 동기화·지오코딩·정리 (비-머니)
#          "*/2 * * * *"    — 어드민 단체메일 큐 drain (비-머니)

# ============================================================
# Production Secrets — NEVER add actual secrets here!
# ============================================================
# ⚠️ SECURITY WARNING:
# - wrangler.toml is committed to Git
# - NEVER put real secrets in [vars] section
# - Use wrangler CLI to add secrets securely:
#
# HOW TO ADD SECRETS:
# 1. Use wrangler CLI (encrypts and stores in Cloudflare):
#    wrangler secret put SECRET_NAME
#    (Then enter the secret value when prompted)
#
# 2. Or use Cloudflare Dashboard:
#    Workers & Pages → Your Worker → Settings → Variables → Encrypt
#
# REQUIRED SECRETS (must be added via wrangler secret put):
#   wrangler secret put TOSS_SECRET_KEY             # Toss Payments secret key (sk_test_... or sk_live_...)
#   wrangler secret put JWT_SECRET                  # JWT signing secret (min 32 chars, generate with: openssl rand -hex 32)
#   wrangler secret put FIREBASE_PROJECT_ID         # Firebase project ID
#   wrangler secret put FIREBASE_PRIVATE_KEY        # Firebase Admin SDK private key (PEM format)
#   wrangler secret put FIREBASE_CLIENT_EMAIL       # Firebase Admin SDK service account email
#   wrangler secret put FIREBASE_DATABASE_URL       # Firebase Realtime Database URL
#   wrangler secret put KAKAO_REST_API_KEY          # Kakao OAuth REST API key
#   wrangler secret put ADMIN_EMAIL                 # Admin login email
#   wrangler secret put ADMIN_PASSWORD              # Admin login password
#   wrangler secret put SELLER_EMAIL                # Seller login email
#   wrangler secret put SELLER_PASSWORD             # Seller login password
#
# OPTIONAL SECRETS (add if using these features):
#   wrangler secret put TOSS_WEBHOOK_SECRET         # Toss webhook validation secret
#   wrangler secret put YOUTUBE_CLIENT_ID           # YouTube OAuth client ID
#   wrangler secret put YOUTUBE_CLIENT_SECRET       # YouTube OAuth client secret
#   wrangler secret put YOUTUBE_API_KEY             # YouTube Data API key
#   wrangler secret put ALIMTALK_API_KEY            # Alimtalk API key
#   wrangler secret put ALIMTALK_SENDER_KEY         # Alimtalk sender key
#   wrangler secret put VAPID_PUBLIC_KEY            # Web Push VAPID public key
#   wrangler secret put VAPID_PRIVATE_KEY           # Web Push VAPID private key
#   wrangler secret put DISCORD_WEBHOOK_URL         # Discord notification webhook
#   wrangler secret put SENTRY_DSN                  # Sentry error tracking DSN
#
# VERIFY SECRETS:
#   wrangler secret list                            # List all configured secrets
#   wrangler secret delete SECRET_NAME              # Delete a secret
