          if [ "$COUNT" -lt 500 ]; then
            echo "❌ 검사 대상이 $COUNT 개뿐 — tsconfig 로드가 중단됐거나 include 가 깨졌다."
            echo "   (0 에러가 '통과'가 아니라 '아무것도 안 봤다' 일 수 있다)"
            npx tsc --noEmit --skipLibCheck --listFilesOnly 2>&1 | head -20
            exit 1
          fi
        continue-on-error: false

