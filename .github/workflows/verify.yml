name: PR Verification

# PR 단위 빠른 검증 — 빌드 + 정적 분석 + 번들 예산 체크.
# 배포는 main.yml 이 담당하므로 여기는 검증만.
#
# 🛡️ 2026-05-13: push trigger 복원 (public repo 라 Actions 무제한 무료).
#   pre-commit hook 우회 (-n) 해도 PR 에서 반드시 통과해야 main 머지 가능.
#
# 🛡️ 2026-07-28: 같은 커밋에 pull_request + push 두 이벤트가 각각 run 을 만들어 **Verify 가 매번 2번**
#   돌고 있었다(실측: 커밋 f5c2093f7 에 run 30351104564 / 30351136667 두 개, 각 ~7분). 아래 concurrency 가
#   두 이벤트를 **같은 group** 으로 묶어 나중 것이 앞 것을 취소 → 커밋당 1회로 수렴(연속 푸시도 최신만).
#   ⚠️ group 키는 반드시 양쪽 이벤트에서 같은 값이어야 한다: push=ref_name, pull_request=head_ref
#   (둘 다 브랜치명). `github.event.pull_request.number || github.ref` 로 쓰면 이벤트별로 갈려 dedup 안 됨.
on:
  # 🔴 **pull_request 에는 paths-ignore 를 두지 않는다** (2026-08-03 실사고).
  #
  #   두었을 때 이런 상태가 만들어졌다: 코드 커밋(b326fc7)을 밀어 Verify 가 돌던 중,
  #   **문서 전용 커밋(5de7b35)을 뒤에 밀자** concurrency 가 앞 run 을 **취소**했고,
  #   뒤 커밋은 paths-ignore 라 **자기 run 을 만들지 않았다.**
  #   결과: PR 에 **실패한 체크가 하나도 없는데 그 코드는 한 번도 검증되지 않은 상태.**
  #   (위 주석이 약속한 *"코드가 한 파일이라도 섞이면 정상 실행된다"* 는 **push 이벤트에선 거짓**이다 —
  #    push 는 그 푸시의 파일만 보므로 문서 커밋 하나는 문서 커밋일 뿐이다.)
  #
  #   ⇒ PR 은 **항상** 검증한다. 비용은 문서 PR 도 ~10분 도는 것이고(이 레포는 public 이라 Actions 무료),
  #     얻는 건 "머지되는 코드는 반드시 한 번은 검증됐다"는 보장이다. 그 비대칭이 명백하다.
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # main push 는 main.yml 이 처리
    # push 쪽 skip 은 유지한다 — PR 이 열려 있으면 위 pull_request 가 어차피 전수 검증한다.
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # fetch-depth: 0 — file-size ratchet 의 --changed-only 가 origin/main 과의 merge-base 를
      # 계산해야 함 (기본 shallow(depth 1) clone 엔 main 이력이 없어 merge-base 불가 → 전수 폴백돼
      # main 드리프트로 무관한 PR 이 실패하는 원래 문제가 재발). PR/push 양쪽 이벤트 모두 커버.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🛡️ 2026-07-25: 유닛테스트를 PR 단계에서 실행 — 그간 main.yml(배포)에서만 돌아 PR CI 는 green 인데
      #   병합 후 배포가 테스트 실패로 죽는 사고 실발생(전수조사 #729 → #730 복구). PR 에서 먼저 발각되게.
      - name: Run unit tests
        run: npm test -- --run

      # ── 1. 영구 안티패턴 검사 (사고 재발 방지) ──
      - name: Hono v4 라우터 안티패턴 (wildcard cors)
        run: |
          # 모든 features/*.routes.ts 검사 — 2026-05-12/13 405 사고 패턴
          violations=$(grep -rnE "\.use\s*\(\s*['\"]\*['\"][^)]*cors\s*\(" \
            src/features/ --include='*.routes.ts' 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "❌ Wildcard cors() 발견 — 405 사고 재발 위험:"
            echo "$violations"
            echo "해결: worker/index.ts:244 글로벌 cors 가 처리. sub-router cors() 제거."
            exit 1
          fi
          echo "✅ 라우터 안티패턴 없음"

      - name: "'vite build' 단독 사용 차단"
        run: |
          # 검사 대상: scripts/ 내 실제 실행 가능한 sh / ps1 / mjs / cjs / js / ts
          # 제외: 문서 (md), 검사 스크립트 자체, install-hooks 의 에러메시지, workflow yml
          EXCLUDE='check-build-command\.sh|install-git-hooks\.sh|\.github/workflows/'
          violations=$(find scripts -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' \) 2>/dev/null \
            | grep -vE "$EXCLUDE" \
            | xargs grep -nE "(^|[^a-zA-Z_:-])(npx +)?vite +build([^a-zA-Z_]|$)" 2>/dev/null \
            | grep -v "npm run build" \
            | grep -v "build:client" \
            | grep -vE "^[^:]*:[0-9]*:[[:space:]]*[#/]" \
            | grep -vE 'echo .*vite build|console\.|# ' \
            || true)
          if [ -n "$violations" ]; then
            echo "❌ 'vite build' 단독 사용 — _worker.js 미갱신 사고 패턴:"
            echo "$violations"
            echo ""
            echo "  🔧 해결: 'npm run build' 사용 (client + worker + prepare 전체)"
            exit 1
          fi
          echo "✅ 빌드 명령 안전"

      - name: Hardcoded secret 검출
        run: |
          # 실제 secret (AWS / Stripe) 만 검출. PEM 마커는 false-positive 많아서 제외:
          #   - firebase-admin.ts 등이 env PEM 파싱하기 위해 string literal 로 사용
          #   - 실제 PEM 키 body 가 commit 됐는지 검증하려면 multi-line 분석 필요
          violations=""
          for f in $(find src/ -type f \( -name "*.ts" -o -name "*.tsx" \) | grep -vE "\.test\.|\.spec\.|/tests/|/__tests__/"); do
            # Stripe live key (sk_live_ + 20+ char) — 정규식/검증 코드 제외
            m=$(grep -nE "sk_live_[A-Za-z0-9]{20,}" "$f" 2>/dev/null \
              | grep -vE "regex|\.test\(|\.match\(|\.includes\(|\.replace\(|// |/\\*" \
              || true)
            [ -n "$m" ] && violations="$violations\n[$f] Stripe live secret:\n$m"

            # AWS access key
            m=$(grep -nE "AKIA[0-9A-Z]{16}" "$f" 2>/dev/null \
              | grep -vE "// |/\\*" \
              || true)
            [ -n "$m" ] && violations="$violations\n[$f] AWS access key:\n$m"

            # 실제 PEM key body (BEGIN + base64 + END 의 multi-line 블록)
            # awk 로 BEGIN ~ END 사이에 base64 문자열 있는지 확인
            m=$(awk '
              /BEGIN (RSA )?PRIVATE KEY/ {found_begin=NR; key_body=""}
              found_begin && /^[A-Za-z0-9+\/=]{20,}$/ {key_body=$0}
              found_begin && /END (RSA )?PRIVATE KEY/ {
                if (key_body) print FILENAME":"found_begin": (actual PEM key body detected)"
                found_begin=0
              }
            ' "$f" 2>/dev/null || true)
            [ -n "$m" ] && violations="$violations\n$m"
          done
          if [ -n "$violations" ]; then
            echo "❌ Secret 누출 의심 — public repo 영구 노출 위험:"
            echo -e "$violations"
            exit 1
          fi
          echo "✅ Secret 없음"

      # 🛡️ 2026-07-28: 위 검사는 **src/ 아래 .ts/.tsx 만** 본다. 실제로는 archive/ 의 **19개 .md/.txt**
      #   에 Google 서비스계정 개인키·Toss live 시크릿·Stripe 시크릿이 **추적된 채** 남아 있었고
      #   (public 레포 · 3월부터) 이 검사도 check-no-secrets.sh 도 통과시켰다.
      #   → 확장자·경로 무관 전수 스캔. 작업트리만 보고 history 는 안 본다(과거분은 *회전*으로만 해결).
      - name: 시크릿 자재 전수 스캔 (strict)
        run: node scripts/check-secret-material.mjs
        continue-on-error: false

      # 🛡️ 2026-07-28: Firebase 토큰 인증 수용 금지. 유출된 서비스계정 개인키로
      #   [커스텀 토큰 → ID 토큰 교환 → Bearer 제출] 하면 임의 uid 로그인이 됐다(#798 후속).
      #   키 폐기와 별개로 '수용 경로' 자체를 닫았고, 이 가드가 재개방을 막는다.
      - name: Firebase 인증 수용 경로 금지 (strict)
        run: node scripts/check-no-firebase-auth.mjs
        continue-on-error: false

      # 💓 2026-07-28: cron 하트비트 커버리지. safeCron 은 '예외가 날 때만' 기록했는데 실제로 아픈
      #   정지는 예외가 없다(미발화/게이트 OFF/내부 .catch 로 삼킴 — #793 이 그 사례).
      - name: cron 하트비트 커버리지 (strict)
        run: node scripts/check-cron-heartbeat.mjs
        continue-on-error: false

      # 🪦 2026-08-25: 그 **짝**. 위는 "감쌌는가"를 보고, 이건 **이름이 사라졌는데 그냥 갔는가**를 본다.
      #   하트비트 행은 코드보다 오래 살아, 사라진 이름은 영원히 빨갛고 그 하나가 경보 채널을 침묵시킨다
      #   (#1056 이 21일 — 그 사이 08-24 정산 16개 누락이 신호 0 이었다). 하루에 두 번 난 사고다.
      - name: 하트비트 이름 은퇴 (strict)
        run: node scripts/check-beat-name-retirement.mjs -s
        continue-on-error: false

      # ⏰ 2026-08-03: 하트비트 가드의 **짝**. 저건 "safeCron 으로 감쌌는가"를 보는데, 감싼 것이
      #   **안 불리는** 경우는 못 본다 — `if (cron === '0 * * * *')` 블록이 wrangler crons 에 없어
      #   메인 워커에서 한 번도 발화하지 않았고, 거기 든 cron 32개가 조용히 죽어 있었다.
      - name: cron 슬롯 등록 — 안 도는 cron 차단 (strict)
        run: node scripts/check-cron-slot-registered.mjs -s
        continue-on-error: false

      # 🩹 2026-08-02: 머지 충돌 마커가 커밋되는 것을 막는다. 이 레포에서 두 번 났다
      #   (07-11 CLAUDE.md · 08-02 세션이 `git add -A` 로 마커째 푸시). `git add -A` 는 충돌 파일도
      #   '해결됨'으로 표시하므로 git 은 막아 주지 않는다.
      - name: 머지 충돌 마커 (strict)
        run: node scripts/check-conflict-markers.mjs -s
        continue-on-error: false

      # ⏰ 2026-08-02: `0 20 * * 0` 한 줄이 배열 **전체**를 거부시켜 주간 D1 백업이 몇 달간
      #   등록조차 안 됐다(재해복구 0). CF 의 day-of-week 는 1-7 또는 MON-SUN — 0 이 없다.
      - name: cron 표현식 문법 (strict)
        env:
          STRICT_CRON_SYNTAX: 1
        run: node scripts/check-cron-syntax.mjs
        continue-on-error: false

      # 🚦 2026-08-02: 레인이 예산을 우회하는 것을 막는다(인플루언서·B2B 공통).
      #   생 `ctx.waitUntil(await import(…))` 은 **부모 CPU 를 직접 태우면서 예산 분산엔 안 잡힌다**.
      #   `kick` 은 SELF.fetch = 자식 인보케이션 = 자기 예산이라 성격이 정반대다.
      - name: 유어애즈 예산 우회 래칫 (strict)
        run: node scripts/check-ads-dispatch-bypass.mjs -s
        continue-on-error: false

      # 🧬 2026-08-02: **가드가 실제로 실패할 수 있는지** 기계가 확인한다(되돌려-검증 자동화).
      #   이 레포의 반복 사고는 "검사가 실패한다"가 아니라 **"검사가 실패할 수 없다"** 이고,
      #   하루에 세 번 났다(reverse 픽스처 · phase 이름 가설 · 일1회 레인 누락 픽스처).
      #   셋 다 손으로 주입해 보고서야 알았다 — 손으로 하면 다음 세션은 안 한다.
      #   ⚠️ 소스를 잠깐 고쳤다 되돌리므로 **다른 스텝과 병렬로 돌리지 말 것**.
      - name: 가드 주입 검증 (strict)
        run: node scripts/check-guard-mutations.mjs -s
        continue-on-error: false

      # 🧾 2026-07-30: 예산 루프가 **자기 기록을 쓸 몫**을 남기는가. 루프 뒤에는 반드시 D1 쓰기가 있다
      #   (커서·학습상한·자기 스탬프). 예산을 0까지 쓰면 그 쓰기들이 조용히 사라져 **돌았는데 "안 돈 것"**
      #   처럼 보인다. 하루에 세 번 만난 실패 양식이라 래칫으로 고정한다(기존 2건 동결).
      - name: 예산 루프 부기 몫 (strict)
        run: node scripts/check-budget-bookkeeping.mjs -s
        continue-on-error: false

      # 🧮 2026-07-29: 유어애즈 수집 레인 격리. 인라인 ctx.waitUntil 로 붙은 레인은 한 인보케이션의
      #   서브리퀘스트 예산을 다른 레인과 다퉈 **조용히 0건**이 된다(localdata·nara 가 실제로 total_saved:0).
      # 🕳️ 2026-07-29: 포털은 '값 없음'을 문자열 "N/A" 로 준다 — truthy 라 별칭 폴백이 앞 필드의 "N/A" 를
      #   채택하고 뒤의 진짜 값을 건너뛴다. 실측: 통신판매 리드의 31.7% 가 주소 "N/A" + region null 이었고,
      #   카카오 스윕은 `address != ''` 로 걸러 그 행들을 없는 주소로 조회했다(47건 시도 → 0건 발견).
      #   ⚠️ 이 가드는 `a || b` 형태의 2항 폴백은 못 잡는다(구문이 흔해 오탐 없이 특정 불가).
      - name: 공공데이터 '값 없음' 자리표시자 판정 (strict)
        run: node scripts/check-public-data-sentinel.mjs -s
        continue-on-error: false

      - name: 유어애즈 레인 격리 (strict)
        run: node scripts/check-ads-lane-isolation.mjs
      # 🔢 2026-07-29: 시드 버전(가이드/블로그)은 이미 쓴 번호를 다시 쓰면 재시드가 **에러 없이**
      #   그냥 안 돈다 — 배포는 성공하고 라이브 문서만 옛날 것으로 남는다(무음 정지).
      #   이 레포에서 이미 두 번 났다(v8 중복 → v11 주석이 그 수습을 기록 / v4 중복).
      #   세션이 동시에 여러 개 도는 한 계속 난다 → main 히스토리 대비 단조증가를 강제한다.
      - name: 시드 버전 단조증가 (strict)
        run: node scripts/check-seed-version-monotonic.mjs -s
        continue-on-error: false

      # 🔁 2026-07-29: 유어애즈 리드 파이프라인은 행마다 "어느 버전 규칙으로 처리됐나"를 스탬프하고
      #   재처리를 `COALESCE(v,0) < 상수` 로 고른다. 규칙만 고치고 상수를 안 올리면 **에러 없이**
      #   옛 판정이 굳는다. 특히 classify 는 시간 폴백이 없어 **영구**다(2026-07-27 사고의 수습이
      #   바로 이 classified_v 방식이라, 메커니즘 전체가 "상수 올리기"에 걸려 있다).
      - name: 규칙 버전 bump (strict)
        run: node scripts/check-rules-version-bump.mjs -s
        continue-on-error: false

      # 🛡️ 2026-07-29: 가드를 지키는 가드. 이 레포의 반복 사고는 "검사가 실패" 가 아니라
      #   **"검사가 아예 안 도는 것"** 이었다 — 같은 날 실측 3건:
      #     ① 번들 gzip 예산: `.gz` 사이드카를 읽는데 vite 는 안 만듦 → 측정 항상 0 → 영원히 통과
      #     ② check-input-text-color: `dark:text-white` 오탐으로 켤 수 없어 **어디에도 미등록**
      #     ③ check-linkshop-ownership: 대상 파일 부재를 조용히 `continue`
      #   R1(모든 가드가 실제로 실행되는가) + R2(가드가 지목한 고정 경로가 존재하는가) 를 강제한다.
      #   ⚠️ 못 막는 것: 등록은 됐는데 판정 로직이 틀려 늘 통과하는 경우(①) — 그건 각 가드가
      #   "측정 0건이면 실패" 를 스스로 선언해야 한다. 예외는 `guard-registry-ok` 주석.
      - name: 가드 레지스트리 — 안 도는 가드 차단 (strict)
        run: node scripts/check-guard-registry.mjs -s
        continue-on-error: false

      # 🛡️ 2026-07-29: 같은 경로에 라우트를 두 번 달면 먼저 선언된 것만 렌더되고 나머지는
