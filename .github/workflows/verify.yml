        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: false

      # worker 전용 tsconfig 는 선재 에러(env 타입/Buffer 등) 정리 전까지 warn 유지 — 별도 세션에서 정리.
      - name: Type check (worker)
        run: npx tsc --noEmit --skipLibCheck --project tsconfig.worker.json
        continue-on-error: true

      # ── 4. 빌드 ──
      - name: Build client
        env:
          # PR 검증용 더미 — production 배포 아님
          VITE_FIREBASE_API_KEY: 'pr-verify-dummy'
          VITE_FIREBASE_AUTH_DOMAIN: 'pr.example.com'
          VITE_FIREBASE_PROJECT_ID: 'pr-verify'
          VITE_FIREBASE_STORAGE_BUCKET: 'pr.example.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '0'
          VITE_KAKAO_APP_KEY: 'pr-verify'
          VITE_TOSS_CLIENT_KEY: 'pr-verify'
        run: npm run build:client

      - name: Build worker
        run: npm run build:worker

      # ── 5. 번들 예산 ──
      - name: Bundle size budget
        run: npm run check:bundle:budget

      # 🛡️ 2026-07-29: 총합 예산은 **후행** 감지기라(임계값을 넘어야 울림) "청크 하나가 통째로
      #   크리티컬 패스에 새로 들어온" 구조 변화를 여유가 있는 동안 놓친다 — 이 레포에서 세 번 재발했다.
      #   이 가드는 총합이 아니라 **구성**(청크 이름 집합)을 동결해 신규 진입을 즉시 이름으로 알려준다.
      #   반드시 build 뒤에 둘 것(산출물 필요).
      - name: Critical path chunk composition (strict)
        run: node scripts/check-critical-chunks.mjs

      # 🛡️ 2026-08-27: 위 가드는 **index.html** 만 본다. 그런데 2026-07-12 부터 워커가 표면별로
      #   modulepreload 를 **추가 주입**한다(route-chunk-map) — 홈의 실제 첫 페인트는 둘의 합이고,
      #   후자는 어느 가드도 안 보고 있었다. 그 사각지대로 홈에 셀러 대시보드 65KB, /browse 에 또 65KB 가
      #   조용히 나가고 있었다(에러 없음·화면 정상·바이트만 샘). 이름으로 잡는다.
      - name: Consumer surface role-chunk leak (strict)
        run: node scripts/check-surface-role-leak.mjs

      # ── 6. 결과 요약 (artifact) — build 가 성공한 경우만 ──
      - name: Bundle size report
        if: success()
        continue-on-error: true
        run: |
          npm run check:bundle 2>&1 | tee bundle-report.txt
          node scripts/check-bundle-size.mjs --json > bundle-report.json

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            bundle-report.txt
            bundle-report.json
          retention-days: 14
