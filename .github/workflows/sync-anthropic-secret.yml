# 🤖 2026-10-27 (대표 "Api키는 github에 있을텐데") — GitHub Actions 의 ANTHROPIC_API_KEY 를
#   Cloudflare 두 곳(Pages ur-live · cron 워커 ur-live)에 시크릿으로 옮긴다.
#   데모 이용권 사진 AI 판정(src/worker/utils/demo-photo-judge.ts)은 이 키가 있어야 켜진다 — 라이브 실측 2026-10-27:
#   GitHub 에는 있고(SNS 워크플로가 사용) Cloudflare 에는 없었다.
#   값은 로그에 찍지 않고 stdin 으로만 넘긴다. 수동 실행 전용(workflow_dispatch).
name: Sync Anthropic key to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put secret (Pages + cron worker)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then echo "::error::GitHub secret ANTHROPIC_API_KEY 가 비어 있다"; exit 1; fi
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@3 pages secret put ANTHROPIC_API_KEY --project-name=ur-live
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@3 secret put ANTHROPIC_API_KEY --name=ur-live --config=wrangler.toml
          echo "✅ ANTHROPIC_API_KEY → Pages(ur-live) + 워커(ur-live)"
