name: Guard mutations (full)

# 🧬 **주입 전수 검증** — PR 에서 좁힌 만큼을 여기서 되찾는다 (2026-09-08).
#
# ## 왜 따로 떼었나 (실측)
# Verify 48분 29초 중 `check-guard-mutations -s` 가 **37분 24초 = 77%** 였다
# (job 101957335695 스텝 타이밍). 항목이 선형으로 늘어난다.
# 그 48분이 만든 2차 피해가 더 컸다 — CI 가 도는 동안 main 이 움직이고, 거의 모든 PR 이
# 그 매니페스트를 건드리니 **머지 때마다 충돌**했다(2026-09-08 하루에 4번 중 3번이 405).
#
# ⇒ PR 은 `--changed` 로 자기가 건드린 주입만(수 분), **전수는 여기서** 돈다.
#
# ## 🔴 이 워크플로를 지우면 검사가 꺼진다
# `verify.yml` 이 `--changed` 를 쓰는 한, 전수를 도는 곳은 **여기뿐**이다.
# `--changed` 는 "주입 M 의 테스트가 M 의 파일 말고 다른 파일도 읽는" 경우를 못 고른다 —
# 그 사각지대를 메우는 것이 이 전수다. 둘은 짝이고, `guard-mutations-scope.test.ts` 가 그 짝을 고정한다.
#
# ## 🧩 조각으로 돈다 — 벽시계를 주입 수와 무관하게 (2026-10-01, 대표 지시 "영구적으로 해결")
# 한 덩어리로 돌던 시절 벽시계가 **3주 만에 42 → 77분**이 되어 `timeout-minutes: 90` 에 닿았다.
# 주입은 "새 가드를 만들면 주입 한 줄" 룰 때문에 **구조적으로 계속 는다** ⇒ 상향은 벽을 미는 것뿐이다.
# 지금은 `plan` 이 **주입 수를 세어** 조각 수를 정하고 행렬이 그만큼 병렬로 돈다.
# ⇒ 주입이 10,000 이 돼도 **사람이 고칠 숫자가 없다.** 상수·분배 근거: `scripts/guard-mutations-shard.mjs`.
#
# ⚠️ 조각 수를 여기에 **손으로 적지 말 것** — 그 숫자가 낡는 것이 이 워크플로가 이미 당한 사고다
# (주석이 `950건 × 40분` 이라고 2.5배 낡은 값을 적고 있었고, 그래서 여유를 과대평가했다).
#
# ## 언제 도나
#   · main push — 머지된 조합을 바로 전수로 재검
#   · 매일 새벽 — main 이 조용해도 하루 한 번은 반드시 (야간이 진짜 보증이다)
#   · 수동
on:
  push:
    branches: [main]
  schedule:
    # 매일 18:40 UTC = 다음날 03:40 KST. 배포·정비 cron 과 겹치지 않는 시간대.
    - cron: '40 18 * * *'
  workflow_dispatch:

# main push 가 몰리면 최신 것만 — 대신 위 schedule 이 하루 한 번은 반드시 완주시킨다.
concurrency:
  group: guard-mutations-full-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 🧩 조각 수를 **세어서** 정한다. `npm ci` 가 필요 없다 —
  #    러너는 node 내장 + 로컬 `.mjs` 만 import 하므로 `--count` 가 수초에 끝난다.
  plan:
    runs-on: ubuntu-latest
    name: 조각 계획
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        run: |
          COUNT=$(node scripts/check-guard-mutations.mjs --count)
          echo "주입 $COUNT 건"
          node scripts/guard-mutations-shard.mjs --plan "$COUNT" >> "$GITHUB_OUTPUT"

  full:
    needs: plan
    runs-on: ubuntu-latest
    name: 전수 ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    strategy:
      # 🔴 한 조각이 빨간불이어도 나머지는 끝까지 돈다 — 전수의 목적이 "어디가 깨졌나" 를
      #    한 번에 다 보는 것이다. fail-fast 면 첫 빨간불 뒤가 통째로 안 돌아 다시 돌려야 한다.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 계획이 조각당 ~12분을 목표로 잡는다(+ npm ci 실측 ~2분). 넉넉히 두되 무한 대기는 막는다.
    # ⚠️ 이 값을 올려 타임아웃을 피하지 말 것 — 조각이 느려졌다면 `SECONDS_PER_INJECTION` 이
    #    실측과 벌어진 것이고, 그 상수를 고치면 조각 수가 **저절로** 늘어난다.
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # 🔴 `--changed` 를 여기에 붙이지 말 것 — 이 워크플로의 존재 이유가 전수다.
      #    `--shard` 는 전수를 **갈라서** 도는 것이라 합치면 전수와 같다(러너가 0건 조각을 실패로 잡는다).
      - name: 가드 주입 전수 검증 (strict)
        run: node scripts/check-guard-mutations.mjs -s --shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
