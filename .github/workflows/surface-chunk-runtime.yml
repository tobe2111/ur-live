# 📦 손님 화면이 자기가 안 쓰는 코드를 받는가 — 브라우저로 실제 렌더해서 판정한다
#
# ⚠️ **PR 게이트가 아니다.** `duplicate-fetch.yml`·`layout-shift.yml` 과 같은 판단이다 —
#    브라우저 검사는 느리고 환경에 민감해서, 간헐 실패가 머지를 막으면 결국 가드를 꺼 버린다.
name: surface-chunk-runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vite.config.ts'
      - 'scripts/surface-chunks.mjs'
      - 'scripts/generate-route-chunk-map.mjs'
      - 'scripts/check-surface-chunk-runtime.mjs'
      - 'scripts/surface-chunk-runtime-baseline.json'
      - 'scripts/visual-preview.mjs'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'src/components/**'
jobs:
  chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-surface-chunk-runtime.mjs
