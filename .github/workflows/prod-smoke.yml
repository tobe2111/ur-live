name: Prod Smoke (assert — auto QA)

# 🤖 2026-06-19 자동 QA (대표 "사람이 QA 안 해도 되게"):
#   staging 이 없어 컨테이너(원격세션)에서 prod egress 불가 → GitHub Action 이 prod 에 GET 으로
#   핵심 불변식을 **단언**하고, 깨지면 워크플로 실패(빨강) → Actions 탭에서 즉시 발견.
#   read-only(GET 만, 데이터 변경 0). prod-diag.yml(측정 전용)과 분리 — 이쪽은 PASS/FAIL 게이트.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 prod 자동 점검 (배포 회귀·콜드 캐시·바인딩 손실 감지)
  push:
    branches: [main]
    paths: ['.github/smoke-trigger']   # 온디맨드: 트리거 파일 bump 로 즉시 실행

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: 배포 정착 대기 (push 트리거 시 새 배포가 끝나도록)
        if: github.event_name == 'push'
        run: sleep 90

      - name: 핵심 불변식 단언 (소비자 + 유어애즈)
        run: |
          BASE="https://urdeal.kr"
          FAIL=0
          # 일시 콜드/네트워크로 인한 가짜 실패 방지: 최대 3회 재시도.
          # $1=설명 $2=URL $3=본문에 반드시 포함돼야 할 문자열(없으면 '') $4=베이스URL(없으면 $BASE)
          check() {
            local desc="$1" url="$2" must="$3" base="${4:-$BASE}" code body ok=0
            for try in 1 2 3; do
              body=$(curl -s --max-time 25 -w "\n%{http_code}" "$base$url" -H 'accept: application/json' 2>/dev/null || true)
              code=$(printf '%s' "$body" | tail -1)
              body=$(printf '%s' "$body" | sed '$d')
              if [ "$code" = "200" ]; then
                if [ -z "$must" ] || printf '%s' "$body" | grep -q -- "$must"; then ok=1; break; fi
              fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "✅ PASS  $desc  ($url)"
            else
              echo "❌ FAIL  $desc  ($url)  → HTTP $code, must-contain: [$must]"
              FAIL=1
            fi
          }

          echo "##### 1) 기본 가용성 #####"
          check "API 살아있음"            "/api/version"                       ""
          check "소비자 상품 API"          "/api/products?page=1&limit=4"       '"success"'

          echo "##### 2) 철거된 도매 표면은 410 (2026-10-11 철거 · 2026-10-12 410 처리) #####"
          # 🪦 2026-10-12: 여기 있던 도매 카탈로그·SSR·게스트가격 검사(ur-wholesale.pages.dev)를 지웠다.
          #   도매몰은 2026-10-11 코드에서 철거돼 그 검사는 **매 회차 실패**하고 있었다(빨간불이 상시라
          #   진짜 소비자 회귀가 나도 새 신호가 안 났다). 대신 철거가 유지되는지를 본다 — 200 으로
          #   되살아나면 철거 표면이 다시 색인 가능한 빈 페이지가 된다.
          for p in /wholesale /supplier; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE$p" || echo "000")
            if [ "$code" = "410" ]; then
              echo "✅ PASS  철거 표면 $p → 410"
            else
              echo "❌ FAIL  철거 표면 $p → HTTP $code (기대 410)"
              FAIL=1
            fi
          done

          echo "##### 5) 소비자 핵심 경로 (교환권/동네딜/홈 SSR) #####"
          check "교환권 카탈로그 API"        "/api/products?page=1&limit=20&deal_only=1&sort=price_low" '"success"'
          # 응답 형식 불확실한 건 HTTP 200 만 단언(가짜 빨강 방지).
          check "동네딜(공구) API"           "/api/group-buy/products?status=active"                    ''
          check "교환권 카테고리"            "/api/vouchers/categories"                                 ''
          # 소비자 홈 SSR — index.html #root 에 데이터 슬롯이 주입돼야 함(없으면 홈 스켈레톤/콜드 회귀).
          HOME=$(curl -s --max-time 25 "$BASE/" 2>/dev/null || true)
          if printf '%s' "$HOME" | grep -q "__SSR_INITIAL_MAIN__"; then
            echo "✅ PASS  소비자 홈 SSR 슬롯 주입됨"
          else
            echo "❌ FAIL  소비자 홈 SSR 슬롯 없음 — 홈 콜드 스켈레톤 회귀 가능"
            FAIL=1
          fi

          echo "##### 6) 유어애즈(/ads) 표면 — 2026-07-27 신설(그간 회귀 자동감지 사각) #####"
          # 랜딩 HTML(SPA 셸) 200
          check "유어애즈 랜딩"              "/ads"                                ''
          # ur-ads 워커 위임 살아있음 — 무토큰 /auth/me 는 401 JSON 이 정상(200/404/500 이면 위임/워커 죽음).
          ADSME=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE/api/ads/auth/me" || echo "000")
          if [ "$ADSME" = "401" ]; then
            echo "✅ PASS  ur-ads 워커 위임 (/api/ads/auth/me → 401)"
          else
            echo "❌ FAIL  ur-ads 워커 위임 이상 (/api/ads/auth/me → HTTP $ADSME, 기대 401)"
            FAIL=1
          fi
          # 메인 워커 ads-pay 설정(공개) — 게이트 상태 무관 200 JSON
          check "유어애즈 결제 설정"          "/api/ads-pay/config"                 ''

          echo "##### 7) 모집 퍼널 뒷단 — 2026-07-28 신설(신청 → 가입 → 첫 판매 연결) #####"
          # 초대코드 클레임 페이지 — 온보딩 메일·신청완료·어드민 모집 안내가 전부 이 URL 로 보낸다(죽으면 퍼널 단절).
          check "크리에이터 시작 페이지"      "/creators/start"                     ''
          check "크리에이터 신청 페이지"      "/creators/apply"                     ''
          # 클레임 API — 존재할 수 없는 코드라 **아무 행도 안 바뀜**(read-only 와 동등).
          #   기대 401(로그인 필요) = 라우트·모듈·스키마(claim_code/linked_user_id/joined_at ALTER) 전부 살아있음.
          #   5xx 면 스키마 미적용 또는 모듈 로드 실패 — prod D1 에 컬럼이 안 생겼다는 유일한 무인증 신호.
          CLAIM=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST "$BASE/api/creator-claim" \
            -H 'content-type: application/json' -d '{"code":"ZZZZZZZZZZZZ"}' || echo "000")
          if [ "$CLAIM" = "401" ]; then
            echo "✅ PASS  초대코드 클레임 (POST /api/creator-claim → 401 · 스키마·라우트 정상)"
          else
            echo "❌ FAIL  초대코드 클레임 이상 (POST /api/creator-claim → HTTP $CLAIM, 기대 401)"
            FAIL=1
          fi

          echo
          if [ "$FAIL" = "1" ]; then
            echo "::error::PROD SMOKE 실패 — 위 ❌ 항목 확인. 소비자/유어애즈 핵심 플로우 회귀 가능."
            exit 1
          fi
          echo "🎉 모든 핵심 불변식 PASS — 소비자/유어애즈 핵심 플로우 정상."
