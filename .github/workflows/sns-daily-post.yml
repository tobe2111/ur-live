name: SNS daily post
on:
  schedule:
    # 슬롯 09:00 / 12:30 / 19:30 KST (스크립트가 오늘 슬롯만 게시)
    - cron: '0 0 * * *'
    - cron: '30 3 * * *'
    - cron: '30 10 * * *'
    # 백업 회차: GitHub 가 정시 cron 을 종종 누락/지연(2026-10-20 03:30 UTC 회차 미실행) — 이미 게시했으면 스크립트가 건너뜀
    - cron: '17 5 * * *'
    - cron: '17 12 * * *'
    # 21:30 KST 시간대 시험(2026-11-09) + 백업
    - cron: '30 12 * * *'
    - cron: '7 14 * * *'
    # 2026-11-18: 마지막 회차(23:07 KST)가 준비 단계에서 멈춰 수요일 인스타가 빠졌다 — 그날의 마지막 안전망 한 번 더(23:41 KST)
    - cron: '41 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (1=실제 게시/발송 안 함)'
        default: '0'
permissions:
  contents: write
  issues: write
  id-token: write   # 실패 시 대표 카톡 알림 — GitHub OIDC 로 서버에 신원 증명(공유 비밀 0)
concurrency:
  group: marketing-bot-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketing-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load bot data from marketing-data branch
        # 봇 데이터(게시 로그/중복 방지)는 main 이 아닌 marketing-data 브랜치에 저장됨 (main 은 보호 브랜치)
        run: |
          if git fetch --depth=1 origin marketing-data 2>/dev/null; then
            git checkout FETCH_HEAD -- data/ 2>/dev/null && echo "loaded data/ from marketing-data" || echo "::warning::marketing-data has no marketing-bot/data yet"
          else
            echo "::warning::marketing-data branch not found; using data/ from main"
          fi
          git reset -q -- data/ || true
      - name: Image tools (Pillow + Pretendard)
        # 게시할 때마다 새 이미지를 그린다(src/visual.mjs → scripts/render-post.py). 실패해도 게시는 종전 카드로 계속된다.
        # 2026-11-18: 평소 25초인 이 단계가 15분 멈춰 작업 전체가 시간 초과로 끝났다(그날 인스타 미게시).
        # 명령마다 시간 상한을 두고, 단계 자체도 5분이면 끊고 다음으로 간다(게시는 종전 카드로 계속).
        timeout-minutes: 5
        continue-on-error: true
        run: |
          timeout 120 python3 -m pip install --quiet --user pillow==11.3.0 || echo "::warning::pillow 설치 실패/시간 초과"
          # 릴스 영상(월·수·금)용. 없으면 그날은 캐러셀로만 나간다.
          command -v ffmpeg >/dev/null || (timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg) || echo "::warning::ffmpeg 설치 실패 — 릴스 대신 캐러셀"
          mkdir -p "$RUNNER_TEMP/fonts"
          for w in ExtraBold Bold SemiBold Medium; do
            curl -fsSL --max-time 30 --retry 2 -o "$RUNNER_TEMP/fonts/Pretendard-$w.otf" "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/public/static/Pretendard-$w.otf" || echo "::warning::폰트 $w 받기 실패"
          done
          echo "FONT_HEAVY=$RUNNER_TEMP/fonts/Pretendard-ExtraBold.otf" >> "$GITHUB_ENV"
          echo "FONT_SEMI=$RUNNER_TEMP/fonts/Pretendard-SemiBold.otf" >> "$GITHUB_ENV"
          echo "FONT_BOLD=$RUNNER_TEMP/fonts/Pretendard-Bold.otf" >> "$GITHUB_ENV"
          echo "FONT_MEDIUM=$RUNNER_TEMP/fonts/Pretendard-Medium.otf" >> "$GITHUB_ENV"
      - name: Card renderer (Chromium)
        # 2026-11-16: 카드를 HTML(2차 시안 디자인)로 그린다(scripts/render-html.mjs). 실패하면 봇이 PIL 로 물러선다.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Collect media library (자료 창고)
        # 상업 이용 가능한 무료 사진·영상(Pixabay·Openverse CC0)을 하루 한 번 모아 채점해 둔다(src/media-library.mjs).
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/media-library.mjs
      - name: Run
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_THREADS_ACCESS_TOKEN: ${{ secrets.META_THREADS_ACCESS_TOKEN }}
          META_FB_PAGE_TOKEN: ${{ secrets.META_FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node src/daily-post.mjs
      - name: Commit data
        if: always()
        continue-on-error: true
        run: |
          git config user.name "urdeal-marketing-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/)" ]; then echo "no data changes"; exit 0; fi
          BR="marketing-data"
          SNAP="$(mktemp -d)"; cp -a data/. "$SNAP/"
          for i in 1 2 3 4 5; do
            if git fetch --depth=1 origin "$BR" 2>/dev/null; then
              git reset -q --hard FETCH_HEAD
            else
              # 브랜치가 없으면 data 만 담은 orphan 브랜치로 생성
              git checkout -q --orphan "tmp-$BR-$i" && git read-tree --empty  # 인덱스를 통째로 비운다(cwd 무관) — data 만 담는다
            fi
            rm -rf data && mkdir -p data && cp -a "$SNAP/." data/
            git add data/
            if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
            git commit -q -m "chore(marketing-bot): update data [skip ci]"
            if git push origin "HEAD:refs/heads/$BR"; then exit 0; fi
            echo "push failed (attempt $i), retrying"; sleep $((i*5))
          done
          echo "::warning::could not push bot data to $BR after 5 attempts (non-fatal)"; exit 0
      - name: Kakao failure alert
        if: failure()
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_MEMO_ACCESS_TOKEN }}
        run: |
          [ -z "$KAKAO_TOKEN" ] && exit 0
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST https://kapi.kakao.com/v2/api/talk/memo/default/send -H "Authorization: Bearer $KAKAO_TOKEN" --data-urlencode "template_object={\"object_type\":\"text\",\"text\":\"[유어딜 마케팅] ${{ github.workflow }} 실패\",\"link\":{\"web_url\":\"$URL\",\"mobile_web_url\":\"$URL\"}}" || true
