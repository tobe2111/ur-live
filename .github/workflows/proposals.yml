# 📄 대외 소개서 자동 생성 (2026-11-02 대표 "제안서는 계속 자동 업데이트가 안돼" → "응 진행해줘. 가장 이상적으로.")
#
# 왜: 소개서(PDF·PPTX 다섯 벌)는 세션이 도구를 깔고 **손으로** 다시 뽑아 커밋해야만 바뀌었다.
#   그래서 10-26 이후 넷이 멈춰 있었고, 숫자도 손으로 적은 그날 값이었다(11-02 실측: 판매 중 이용권
#   165 → 160 · 식사 평균 32,521 → 33,724). 그리고 완성본을 커밋하면 다시 뽑을 때마다 수 MB 씩 git 이
#   영구로 불고, 세션들이 그 바이너리를 다툰다.
#
# 무엇을: 매일 새벽 + 소개서 원본이 main 에 바뀔 때
#   1. 라이브 숫자를 서버에서 받는다(`/api/public/proposal-facts` — 정의 SSOT src/shared/proposal-live-facts.ts)
#   2. 덱 다섯 + PDF 를 만든다 — 쪽수가 어드민 화면 표기와 다르면 실패
#   3. "덱이 말하는 것 ↔ 지금 설정" 경고를 manifest.json 에 남긴다(문장은 자동으로 고치지 않는다 — 대표가 정한다)
#   4. GitHub Release `proposals-latest` 에 올린다(git 기록이 아니다) → 어드민 /admin/proposals 가 거기서 읽는다
#
# 실패하면: 어드민은 저장소에 있는 옛 판으로 내려가고 화면이 그 사실을 말한다. 이 워크플로는 빨갛게 남는다.
name: Proposals (소개서 자동 생성)

on:
  schedule:
    - cron: '23 20 * * *' # 매일 새벽 5시 23분(한국시간)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'docs/business/proposals/**'
      - 'src/shared/proposal-live-facts.ts'
      - 'src/pages/admin/AdminProposalsPage.tsx'
      - '.github/workflows/proposals.yml'

permissions:
  contents: write # Release 자산 올리기

concurrency:
  group: proposals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/business/proposals/package-lock.json

      # 종전 PDF 들이 이 조합(LibreOffice + Noto CJK)으로 만들어졌다 — 같은 글꼴이라야 줄바꿈·쪽수가 같다.
      - name: LibreOffice · 한글 글꼴
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress python3-uno fonts-noto-cjk fonts-dejavu-core

      - name: 덱 의존성
        working-directory: docs/business/proposals
        run: npm ci --no-audit --no-fund

      # main 머지 직후면 새 워커가 아직 안 올라왔을 수 있다 — 몇 번 기다린다(못 받으면 실패: 옛 숫자로 뽑지 않는다).
      - name: 라이브 숫자 받기
        working-directory: docs/business/proposals
        run: |
          for i in 1 2 3 4 5 6; do
            node facts-live.mjs fetch && exit 0
            echo "   ${i}번째 실패 — 60초 뒤 다시"; sleep 60
          done
          exit 1

      - name: 덱 다섯 + PDF + 기록
        working-directory: docs/business/proposals
        run: node build-all.mjs

      - name: Release(proposals-latest)에 올리기
        working-directory: docs/business/proposals/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view proposals-latest >/dev/null 2>&1; then
            gh release create proposals-latest --latest=false --title "대외 소개서 — 자동 생성 최신본" \
              --notes "워크플로 proposals.yml 이 매일 다시 만든다. 어드민 /admin/proposals 가 여기서 읽는다. 손으로 올리지 말 것."
          fi
          gh release upload proposals-latest ./*.pdf ./*.pptx ./manifest.json --clobber

      - name: 요약
        if: always()
        working-directory: docs/business/proposals/out
        run: |
          [ -f manifest.json ] || { echo "manifest.json 없음 — 위 단계에서 멈췄다" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const m = require("./manifest.json");
            const f = m.facts;
            const lines = [
              "## 대외 소개서 자동 생성",
              `숫자 기준 ${f.measuredAt} · 판매 중 이용권 ${f.activeVouchers} · 실제 매장 ${f.realStores} · 식사 평균 ${f.avg.meal}원`,
              "",
              ...m.decks.map((d) => `- ${d.name}: ${d.pages}쪽`),
              "",
              m.warnings.length ? "### ⚠️ 덱이 지금 설정과 다른 말을 한다" : "경고 없음",
              ...m.warnings.map((w) => `- ${w.message} (${w.decks.join(", ")})`),
            ];
            console.log(lines.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
