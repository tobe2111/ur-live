# 🔁 첫 화면 중복 요청 — 브라우저로 실제 렌더해서 센다
#
# ⚠️ **PR 게이트가 아니다.** `dark-contrast.yml`·`layout-shift.yml` 과 같은 판단이다 —
#    브라우저 검사는 느리고 환경에 민감해서, 간헐 실패가 머지를 막으면 결국 가드를 꺼 버린다.
name: duplicate-fetch
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/api.ts'
      - 'src/components/home/useHomeBanners.ts'
      - 'src/pages/VouchersPage.tsx'
      - 'src/pages/user-profile/**'
      - 'scripts/check-duplicate-fetch.mjs'
      - 'scripts/visual-preview.mjs'
      - 'scripts/duplicate-fetch-baseline.json'
jobs:
  dup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-duplicate-fetch.mjs
