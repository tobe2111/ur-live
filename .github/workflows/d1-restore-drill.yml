name: D1 Restore Drill (월간 자동 복원 검증)

# 🛡️ 2026-07-18: 백업 "복원 리허설"을 사람 손에서 자동화 (대표 "리허설도 자동으로").
#
# 배경: d1-backup.yml 이 주간 export(artifact 90일)를 만들지만, "그 덤프가 실제로
#       복원되는가"는 수동 리허설로 남아 있었음 → 복원 안 되는 백업은 백업이 아님.
#       이 워크플로가 매월 최신 백업 artifact 를 내려받아 **실제 복원(sqlite3) + 무결성 검증**.
#
# 검증 = 로컬 sqlite3 복원(덤프 유효성·복원 가능성 증명). 프로덕션 D1 실복원 절차는
#       docs/D1_RESTORE_RUNBOOK.md (재해 시 사람이 수행 — 이 드릴이 그 전제를 상시 보증).
# 스케줄: 매월 1일 21:00 UTC (백업 cron 수 20:00 UTC 과 분산). 실패 시 워크플로 빨강 + Discord.
# 권한: 같은 repo artifact 다운로드 = 기본 GITHUB_TOKEN(actions:read)로 충분 — 신규 secret 불필요.

on:
  schedule:
    - cron: '0 21 1 * *' # 매월 1일 21:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 최신 백업 artifact 찾기 + 다운로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # d1-backup.yml 의 가장 최근 성공 run → 그 run 의 d1-backup-* artifact
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/d1-backup.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "❌ 성공한 d1-backup run 없음 — 백업 파이프라인부터 확인 필요"; exit 1
          fi
          echo "최근 성공 백업 run: $RUN_ID"
          gh run download "$RUN_ID" -R "${{ github.repository }}" --dir backup-dl
          ls -la backup-dl/*/
          GZ=$(find backup-dl -name '*.sql.gz' | head -1)
          if [ -z "$GZ" ]; then echo "❌ artifact 에 .sql.gz 없음"; exit 1; fi
          gunzip -c "$GZ" > backup.sql
          ls -la backup.sql

      - name: 복원 (sqlite3) + 무결성 검증
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 >/dev/null
          # 실제 복원 — 실패(문법/손상)면 여기서 비정상 종료 = 드릴 실패
          sqlite3 drill.db < backup.sql
          # 무결성: 테이블 수 + 핵심 테이블 존재/행수 + PRAGMA integrity_check
          TABLES=$(sqlite3 drill.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table'")
          echo "복원된 테이블 수: $TABLES"
          if [ "$TABLES" -lt 50 ]; then echo "❌ 테이블 $TABLES 개 — 비정상적으로 적음(부분 덤프 의심)"; exit 1; fi
          for T in users products orders sellers vouchers; do
            N=$(sqlite3 drill.db "SELECT COUNT(*) FROM $T" 2>/dev/null || echo "MISSING")
            echo "  $T: $N rows"
            if [ "$N" = "MISSING" ]; then echo "❌ 핵심 테이블 $T 복원 실패"; exit 1; fi
          done
          IC=$(sqlite3 drill.db "PRAGMA integrity_check;")
          echo "integrity_check: $IC"
          if [ "$IC" != "ok" ]; then echo "❌ integrity_check 실패"; exit 1; fi
          echo "✅ 복원 드릴 성공 — 최신 백업은 실제 복원 가능"

      - name: Discord notification (실패 시)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"content\":\"🚨 D1 restore drill FAILED — 백업이 복원 불가일 수 있음! run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi
