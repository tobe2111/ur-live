# 🖼️ 렌더 스모크 — 시안 적용분이 **실제로 그려지는지** 브라우저로 본다.
#
# ⚠️ **PR 게이트로 승격하지 말 것.** 브라우저·dev 서버를 띄우므로 느리고(≈1분) 환경에 민감하다.
#   `live-contracts.yml` 과 같은 판단이다 — 간헐 실패가 머지를 막으면 가드를 꺼 버리게 된다.
#   대신 **손으로 돌릴 수 있게** 하고(`workflow_dispatch`), 표면을 만지는 PR 에서만 자동으로 돈다.
#
# 이 스모크가 잡는 것(정적 검사가 못 보는 것):
#   · 몰 색 위 글자 대비 — 계산된 색을 읽어 WCAG 를 직접 잰다(다크 2.24:1 을 이렇게 찾았다)
#   · `rose-*` 리맵 — tailwind 가 브랜드 색조를 잉크로 바꿔 마감 배지가 네이비로 나오던 것
#   · 대시보드에 `dark:` 가 실제로 안 붙는지(렌더 판정)
name: Render smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pages/MallHomePage.tsx'
      - 'src/pages/SellerQuickGbPage.tsx'
      - 'src/pages/SellerReturnsPage.tsx'
      - 'src/pages/seller-orders/**'
      - 'src/pages/product-detail/**'
      - 'src/shared/mall/**'
      - 'tailwind.config.js'
      - 'scripts/smoke-mall-render.mjs'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:mall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke-screenshots
          path: artifacts/smoke/
          retention-days: 14
