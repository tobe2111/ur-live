# 🪦 ur-wholesale = **묘비 배포** (2026-10-12 대표 *"남은 것도 다 해줘"*)
#   도매몰은 2026-10-11 코드에서 철거됐고 빌드 분기(INCLUDE_WHOLESALE)도 false 로 고정됐다.
#   그래서 이 워크플로가 매 push 마다 배포하던 것은 **운영 D1 이 연결된 소비자 앱의 사본**
#   (ur-wholesale.pages.dev)이었다 — 쓰는 곳 0, 크롤러에겐 중복 사이트, 보안 수정은 따라가지만
#   존재할 이유가 없다. ⇒ 앱 대신 `deploy/ur-wholesale-tombstone/_worker.js`(모든 요청 410)만 올린다.
#   ⚠️ 프로젝트 자체 삭제는 Cloudflare 대시보드에서 **대표가** 한다(세션 CF 토큰은 읽기 전용).
#     삭제한 뒤에는 이 워크플로를 지운다(그 전에 지우면 묘비가 아니라 마지막 앱 사본이 남는다).
#   🔴 ur-wholesale 에는 cron trigger 를 걸지 말 것(정산 이중성숙 방지 — 종전 규칙 그대로).
#   요구 secret: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID (main.yml 과 동일 재사용).
name: Deploy ur-wholesale

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 묘비는 앱과 무관하다 — 자기 자신과 묘비 파일이 바뀔 때만 다시 올린다.
    paths:
      - '.github/workflows/deploy-wholesale.yml'
      - 'deploy/ur-wholesale-tombstone/**'

concurrency:
  group: deploy-wholesale
  cancel-in-progress: true

jobs:
  deploy-wholesale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (ur-wholesale)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — ur-wholesale 배포 불가"
            exit 1
          fi
          set -e
          # ⏱️ 10429(레이트 리밋)는 초 단위로 안 풀린다 — 근거·사고 경위는 main.yml 의 같은 블록 주석 참조.
          MAX_RETRY=4
          for i in $(seq 1 $MAX_RETRY); do
            echo "=== Deploy attempt $i/$MAX_RETRY (ur-wholesale) ==="
            OUT=$(npx --yes wrangler@3 pages deploy deploy/ur-wholesale-tombstone \
                --project-name=ur-wholesale \
                --branch=main \
                --commit-dirty=true \
                --commit-message="wholesale tombstone ${{ github.sha }}" 2>&1) && RC=0 || RC=$?
            echo "$OUT"
            if [ $RC -eq 0 ]; then
              echo "✅ ur-wholesale deploy succeeded on attempt $i"
              exit 0
            fi
            if [ $i -lt $MAX_RETRY ]; then
              if echo "$OUT" | grep -qE '10429|Rate limited'; then
                SLEEP=$(( i == 1 ? 60 : (i == 2 ? 150 : 300) ))
                echo "⏳ Cloudflare 레이트 리밋(10429) — ${SLEEP}s 후 재시도"
              else
                SLEEP=$((i * 10)); echo "⚠️ attempt $i 실패. ${SLEEP}s 후 재시도..."
              fi
              sleep $SLEEP
            fi
          done
          echo "❌ ur-wholesale 배포 $MAX_RETRY 회 모두 실패."
          exit 1

      # 🚨 **실패를 대표가 보는 곳에 남긴다** (2026-08-03 신설 — 근거는 scripts/report-deploy-failure.sh).
      #   배포 실패는 Actions 탭 안에만 있었고 아무도 안 봤다. 그 사이 라이브는 4개 머지만큼 뒤처졌다.
      #   ⚠️ `continue-on-error` — 관측이 배포 결과를 바꾸면 본말전도다.
      - name: 배포 실패를 어드민에 기록 (조용한 실패 차단)
        if: failure()
        continue-on-error: true
        run: bash scripts/report-deploy-failure.sh "ur-wholesale (도매 Pages)" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
