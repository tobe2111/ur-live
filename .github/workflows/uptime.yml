name: Uptime Monitor

# 🛡️ 2026-06-10 (사용자 승인 — "서버 장애를 사용자가 먼저 아는 구조" 제거):
#   10분마다 핵심 endpoint 를 외부(GitHub 러너)에서 점검 — 사이트가 죽으면 worker cron 도
#   같이 죽으므로 반드시 외부 관측이어야 함. 외부 서비스 가입 불필요.
#   다운 감지 → 'uptime' 라벨 이슈 생성(중복 방지 — 열려있으면 코멘트) → GitHub 이메일 알림.
#   복구 감지 → 이슈 자동 닫기. 비용 0 (public repo Actions 무료).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe critical endpoints
        id: probe
        run: |
          FAILS=""
          check() {
            local label="$1"; shift
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$@" || echo "000")
            echo "$label → $code"
            # 5xx / 000(타임아웃·연결실패) = 다운. 4xx 는 worker 살아있음(정상 간주).
            case "$code" in
              5*|000) FAILS="${FAILS}${label} (HTTP ${code})\n" ;;
            esac
          }
          # 🔎 worker 생존 신호 — 캐시를 우회하되 **라우트를 실제로 통과**해야 한다.
          #   🔴 2026-08-04 수리: 종전 `-X POST /api/version` 은 그 라우트가 GET 전용이라 **항상 404** 였다.
          #     4xx 는 '정상'으로 세므로 이 검사는 자기 목적("worker 가 응답하는가")을 한 번도 확인한 적이 없다.
          #     ⇒ GET + 캐시버스트 쿼리로 바꾼다(우회 목적은 유지, 이제 실제로 200 을 받는다).
          check "API worker (GET /api/version)" "https://urdeal.kr/api/version?cb=${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          # 핵심 상거래 API 2종 — 둘 다 **이 워커(ur-live)가 실제로 서빙하는** 경로여야 한다.
          check "교환권/상품 목록" "https://urdeal.kr/api/products?limit=1"
          # 🏭 [wholesale-split 2026-07-16] 도매는 **별도 워커(ur-wholesale)** 다 — 메인 도메인은 404.
          #   🔴 2026-08-04: 여기가 `urdeal.kr/api/wholesale/catalog` 를 두드리고 있었다. 늘 404 →
          #     4xx='정상' 규칙에 걸려 **실패할 수 없는 검사**로 3주를 보냈다. #544(7/29)가 prod-smoke 는
          #     같은 이유로 고쳤는데 이 파일이 빠졌다. 도매 점검은 그쪽(자기 도메인)이 담당하므로
          #     여기서는 **ur-live 가 실제로 서빙하는 소비자 경로**로 대체한다(동네딜 피드, 200 실측).
          check "동네딜 피드" "https://urdeal.kr/api/group-buy/products?status=active"
          # HTML 셸
          check "메인 페이지 HTML" "https://urdeal.kr/"
          # 🫀 cron 침묵 감지 (dead-man's switch) — cron 내부 자가진단은 cron 전면 사망 시 같이
          #   죽으므로 **외부 관측이 유일한 진짜 감시**다.
          #
          # 🔴 **다운 판정(FAILS)에서 분리했다** (2026-08-04). 종전엔 이 503 이 위 endpoint 들과 같은
          #   바구니에 들어가 "사이트 다운"으로 집계됐다. 그런데 cron 침묵은 **한 번 빨개지면 며칠 간다** —
          #   실측: 이슈 #845 가 7/29 부터 6일째 열린 채 코멘트 84개, 원인 19건이 전부 `ads:*` 레인.
          #   그동안 이 워크플로는 **이미 빨간불**이라 진짜 사이트 다운이 나도 새 신호를 못 냈다.
          #   경보의 목적이 정반대로 뒤집힌 상태였다(가려진 dead-man's switch).
          #   ⇒ cron 은 `CRON_DOWN` 으로 **따로** 집계하고, 사이트 다운 이슈와 라벨을 나눈다.
          #   ⚠️ 무시하는 게 아니다 — 아래 별도 스텝이 자기 이슈를 연다. 섞지만 않는다.
          cron_body=$(curl -s --max-time 20 -w "\n%{http_code}" "https://urdeal.kr/api/_healthcheck/cron" || printf "\n000")
          cron_code=$(printf '%s' "$cron_body" | tail -n1)
          echo "Cron heartbeat (침묵 감지) → $cron_code"
          case "$cron_code" in
            5*|000) echo "cron_down=true" >> "$GITHUB_OUTPUT" ;;
            *)      echo "cron_down=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "cron_code=$cron_code" >> "$GITHUB_OUTPUT"
          # 🔬 **무엇이 침묵 중인지**까지 뽑는다 (2026-08-25). 종전엔 HTTP 코드만 봐서
          #   "빨간불이 계속 빨간불"과 "빨간불인데 원인이 통째로 바뀜"을 구분할 수 없었다.
          #   ⚠️ 파싱 실패는 빈 목록이 아니라 `?` — 빈 목록으로 두면 응답을 못 받은 것이
          #   "전부 회복"으로 읽혀 거짓 해소 코멘트가 나간다.
          printf '%s' "$cron_body" | sed '$d' > /tmp/cron_hc.json
          cron_stale=$(python3 -c "import sys,json;d=json.load(open('/tmp/cron_hc.json'));print(','.join(sorted({str(x.get('name','')) for x in (d.get('data') or {}).get('stale') or []} - {''}))[:900])" 2>/dev/null || echo '?')
          if [ -z "$cron_stale" ] && [ "$cron_code" != "200" ]; then cron_stale='?'; fi
          echo "cron_stale=$cron_stale" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILS" ]; then
            echo "down=true" >> "$GITHUB_OUTPUT"
            printf "fails<<EOF\n${FAILS}EOF\n" >> "$GITHUB_OUTPUT"
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open/close incident issue
        uses: actions/github-script@v7
        env:
          DOWN: ${{ steps.probe.outputs.down }}
          FAILS: ${{ steps.probe.outputs.fails }}
        with:
          script: |
            const down = process.env.DOWN === 'true'
            const fails = process.env.FAILS || ''
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime',
            })
            const open = issues[0]
            const now = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })
            if (down) {
              const body = `🔴 **다운 감지** (${now} KST)\n\n실패 endpoint:\n\`\`\`\n${fails}\`\`\`\n10분 뒤 자동 재점검합니다. 복구되면 이 이슈는 자동으로 닫힙니다.\n\n조치 가이드: Cloudflare Dashboard → Workers & Pages → ur-live 배포 상태 / 최근 배포 롤백.`
              if (open) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body })
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `🔴 [장애] urdeal.kr 다운 감지 — ${now}`,
                  body, labels: ['uptime'],
                })
              }
            } else if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
                body: `🟢 **복구 확인** (${now} KST) — 전체 endpoint 정상. 이슈를 닫습니다.`,
              })
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, state: 'closed' })
            }

      # 🫀 cron 침묵은 **별도 이슈**로 — 사이트 다운과 라벨을 나눈다.
      #   위 스텝과 섞으면 며칠 가는 cron 빨간불이 다운 감지를 통째로 가린다(2026-08-04 실측 6일).
      #   ⚠️ 코멘트를 매 회차(10분) 달지 않는다 — #845 가 코멘트 84개로 불어나 아무도 안 읽게 된 원인이다.
      #     상태가 바뀔 때(열림/닫힘)만 쓴다.
      #
      # 🔴 **2026-08-25 수리 — "상태"가 열림/닫힘 두 값뿐이라 채널이 통째로 죽어 있었다.**
      #   이슈 #1056 이 08-04 부터 **21일째 열린 채 한 줄도 갱신되지 않았다.** 원인은 `d1-backup`
      #   하나 — 08-02 에 OOM 으로 죽고 후임이 인수한 **이름만 남은 행**이라 영원히 회복할 수 없었고,
      #   그래서 `down` 이 영원히 true 였다. 그 사이 **08-24 에 일간 16개(정산 성숙·원장 정합 포함)가
      #   통째로 빠졌는데 새 신호가 0** 이었다 — 이미 열려 있었으니 아무 일도 안 일어난 것이다.
      #   경보를 나누고(#845 수리) 죽은 이름을 걷어내도(개명 지도), **"열려 있는 동안은 침묵"이라는
      #   설계가 남아 있는 한 같은 사고가 반복된다.**
      #   ⇒ 판정 단위를 `down` 이 아니라 **침묵 중인 이름의 집합**으로 올린다. 집합이 바뀔 때만
      #     코멘트하므로 10분마다 쌓이지 않는다(#845 의 교훈은 그대로 지킨다).
      - name: Open/close cron-silence issue
        uses: actions/github-script@v7
        env:
          CRON_DOWN: ${{ steps.probe.outputs.cron_down }}
          CRON_CODE: ${{ steps.probe.outputs.cron_code }}
          CRON_STALE: ${{ steps.probe.outputs.cron_stale }}
        with:
          script: |
            const down = process.env.CRON_DOWN === 'true'
            const raw = String(process.env.CRON_STALE || '')
            // `?` = 응답을 못 읽었다. 빈 목록(=전부 회복)과 절대 섞지 않는다.
            const parsed = raw === '?' ? null : raw.split(',').map(s => s.trim()).filter(Boolean)
            const MARK = (list) => `<!-- stale:${list.join(',')} -->`
            const readMark = (body) => {
              const m = /<!-- stale:([^>]*) -->/.exec(body || '')
              return m ? m[1].split(',').map(s => s.trim()).filter(Boolean) : null
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cron-silence',
            })
            const open = issues[0]
            const now = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })
            if (down && !open) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🟡 [cron 침묵] 일부 작업이 기대 주기를 넘김 — ${now}`,
                body: `🟡 **cron 침묵 감지** (${now} KST · HTTP ${process.env.CRON_CODE})\n\n`
                  + `상세: \`GET /api/_healthcheck/cron\` 의 \`stale\` 목록.\n`
                  + `⚠️ \`retired\`(개명·인수된 이름)는 판정에서 제외됩니다 — 남은 건 진짜 침묵입니다.\n\n`
                  + `복구되면 자동으로 닫힙니다. **상태가 바뀔 때만** 코멘트가 달립니다.\n`
                  + `유어애즈 레인이면 디스코드 일 1회 요약도 함께 옵니다(\`silence-digest\`).\n\n`
                  + (parsed && parsed.length ? `침묵 중(${parsed.length}): ${parsed.join(' · ')}\n\n` : '')
                  + MARK(parsed || []),
                labels: ['cron-silence'],
              })
            } else if (down && open && parsed) {
              // 🔬 열려 있는 동안에도 **무엇이 침묵 중인지 바뀌면** 알린다. 안 바뀌면 조용하다.
              const prev = readMark(open.body) || []
              const added = parsed.filter(n => !prev.includes(n))
              const gone = prev.filter(n => !parsed.includes(n))
              if (added.length || gone.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
                  body: `🔄 **침묵 목록이 바뀌었습니다** (${now} KST)\n\n`
                    + (added.length ? `➕ 새로 침묵(${added.length}): ${added.join(' · ')}\n` : '')
                    + (gone.length ? `➖ 해소(${gone.length}): ${gone.join(' · ')}\n` : '')
                    + `\n현재 침묵 중(${parsed.length}): ${parsed.join(' · ')}`,
                })
                const body = String(open.body || '').replace(/<!-- stale:[^>]* -->/, '').trimEnd()
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
                  body: `${body}\n\n${MARK(parsed)}`,
                })
              }
            } else if (!down && open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
                body: `🟢 **cron 침묵 해소** (${now} KST) — 전 작업이 기대 주기 안. 이슈를 닫습니다.`,
              })
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, state: 'closed' })
            }
