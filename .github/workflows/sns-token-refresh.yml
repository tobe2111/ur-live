name: SNS token refresh
# Instagram / Threads 장기 토큰(60일)을 매주 갱신한다.
# GH_SECRETS_PAT(repo Secrets 쓰기 권한 PAT)이 있으면 새 토큰으로 secret 을 자동 교체,
# 없거나 실패하면 이슈로 알림(토큰 값은 이슈에 쓰지 않음).
on:
  schedule:
    - cron: '0 1 * * 1' # 매주 월 10:00 KST
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refresh tokens
        env:
          IG_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          TH_TOKEN: ${{ secrets.META_THREADS_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          problems=""
          refresh() { # name secret url
            local name="$1" secret="$2" url="$3" cur="$4"
            if [ -z "$cur" ]; then problems="$problems\n- $name: secret $secret 없음"; return; fi
            resp="$(curl -sS --max-time 30 "$url&access_token=$cur" || true)"
            new="$(echo "$resp" | jq -r '.access_token // empty' 2>/dev/null)"
            if [ -z "$new" ]; then
              err="$(echo "$resp" | jq -r '.error.message // "unknown"' 2>/dev/null | head -c 200)"
              echo "::error::$name 토큰 갱신 실패: $err"
              problems="$problems\n- $name: 갱신 실패 ($err) — 토큰을 수동으로 재발급해 $secret 에 넣어 주세요"
              return
            fi
            echo "::add-mask::$new"
            exp="$(echo "$resp" | jq -r '.expires_in // "?"')"
            if [ -n "$GH_SECRETS_PAT" ]; then
              if printf '%s' "$new" | GH_TOKEN="$GH_SECRETS_PAT" gh secret set "$secret" --repo "$REPO"; then
                echo "$name: 갱신 및 secret 교체 완료 (expires_in=${exp}s)"; return
              fi
              problems="$problems\n- $name: 갱신은 됐지만 gh secret set 실패 (GH_SECRETS_PAT 권한 확인)"
            else
              problems="$problems\n- $name: 갱신됨(expires_in=${exp}s). 장기 토큰은 갱신 호출만으로 만료가 연장되지만, GH_SECRETS_PAT 이 없어 secret 은 교체하지 않음"
            fi
          }
          refresh Instagram META_IG_ACCESS_TOKEN "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token" "$IG_TOKEN"
          refresh Threads META_THREADS_ACCESS_TOKEN "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token" "$TH_TOKEN"
          if [ -n "$problems" ]; then
            body="$(printf "SNS 토큰 갱신 워크플로 결과에 확인이 필요합니다.\n$problems\n\n실행: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID")"
            gh issue create --repo "$REPO" --title "SNS 토큰 갱신 확인 필요 ($(date -u +%F))" --body "$body" || true
            case "$problems" in *실패*|*없음*) exit 1;; esac
          fi
