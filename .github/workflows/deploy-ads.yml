# 🎯 유어애즈 독립 Worker(ur-ads) 배포 — 설계: docs/design/urads-worker-split.md
#
#   메인 Pages(main.yml)와 독립. `wrangler deploy --config wrangler-ads.toml` 로 standalone Worker 배포.
#   ⚠️ 이 워크플로 실패는 라이브 무영향 — ur-ads 는 아직 아무 트래픽도 안 받음(메인이 프록시 안 함, Phase C 전).
#   요구 secret: CLOUDFLARE_API_TOKEN(Workers Scripts:Edit) · CLOUDFLARE_ACCOUNT_ID (main.yml 과 동일 재사용).
#
#   D1/시크릿 바인딩은 Cloudflare 대시보드에서 관리(대표 셋업) — 이 배포는 *코드*만 갱신.
name: Deploy ur-ads Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # ⚠️ 2026-07-29: 이 목록은 **ur-ads 번들이 실제로 끌어오는 코드**를 덮어야 한다.
      #   그 전엔 worker-ads/marketing 만 있어서, `src/worker/utils/cron-heartbeat.ts`(ur-ads 의
      #   하트비트 기록기)나 `src/features/social-media/**`(매시간 도는 소셜 유지보수)만 바꾸면
      #   **배포가 아예 안 돌아 ur-ads 가 조용히 낡은 코드로 계속 돌았다.**
      #   목록이 손복제라 드리프트한 전형적인 사례 — 유닛(`ads-lane-cadence.test.ts`)이 이제
      #   worker-ads 의 import prefix 를 스캔해 여기 빠진 게 있으면 실패시킨다.
      - 'src/worker-ads/**'
      - 'src/features/marketing/**'
      - 'src/features/social-media/**'
      - 'src/features/supply/**'
      - 'src/worker/**'
      - 'wrangler-ads.toml'
      - 'scripts/build-worker-ads.js'

concurrency:
  group: deploy-ads
  cancel-in-progress: true

jobs:
  deploy-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⏳ **정각을 피해서 배포한다** (2026-08-01 실측으로 신설).
      #
      #   배포는 돌고 있는 isolate 를 즉시 죽인다. ur-ads 의 수집 cron 은 매시 정각 하나뿐인데,
      #   이 레포는 세션이 여러 개 병렬로 돌아 머지가 잦고 이 워크플로의 경로 필터가 넓다
      #   (`src/worker/**` · `src/features/{marketing,social-media,supply}/**`) — 즉 **거의 모든 머지가
      #   ur-ads 를 재배포**한다. 실측: 13:42~14:02 **20분에 11회**.
      #
      #   그래서 14:00 틱이 이렇게 죽었다 — 레인 7개가 **같은 순간(14:01:10)** 같은 벽(ms 10505~10663)에서
      #   끊겼고, 그중 둘(`match-registry` 14:01:05 · `reclassify` 14:01:09)은 **이미 일을 끝낸 상태**였다.
      #   코드에 10초 타임아웃은 없다 = 밖에서 한 번에 죽였다는 뜻이다.
      #
      #   ⇒ 정각 전후(:57~:03)에는 배포를 미룬다. ur-ads 는 백그라운드 수집기라 몇 분 늦어도 무해하고,
      #     `concurrency: cancel-in-progress` 덕에 기다리는 동안 새 머지가 오면 이 잡은 취소된다(항상 최신만 나감).
      #
      #   ⚠️ 이게 **못 막는 것**: 배포가 아닌 이유(플랫폼 한도·자식 수명)로 죽는 틱은 그대로다.
      #     그 구분은 이제 하트비트의 `detail` 원문이 해 준다 — 창을 비워야 그 신호를 읽을 수 있다.
      #   🔁 되돌리기: 이 스텝 하나만 지우면 즉시 종전 동작.
      - name: 정각 회차 보호 — 배포 창 대기
        run: |
          # ⏱️ **분만 본다 — 시간대 무관하다.** KST 는 정확히 +9:00 이라 분이 UTC 와 같고,
          #   cron 도 `0 * * * *`(매시 0분)이다. "UTC 라 틀렸다"고 고치지 말 것(고쳐도 같은 값이다).
          for i in $(seq 1 12); do
            M=$(date -u +%-M)
            if [ "$M" -ge 57 ] || [ "$M" -le 3 ]; then
              echo "⏳ UTC :$M — 수집 cron 창(:57~:03)이라 30초 대기 ($i/12)"
              sleep 30
            else
              echo "✅ UTC :$M — 배포 안전 창"; exit 0
            fi
          done
          echo "::warning::대기 상한 도달 — 그대로 배포한다(무한 대기보다 낫다)"

      - name: Build + Deploy ur-ads Worker
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — ur-ads 배포 불가"
            exit 1
          fi
          echo "=== esbuild 번들 ==="
          node scripts/build-worker-ads.js
          echo "=== wrangler deploy (ur-ads) ==="
          MAX_RETRY=3
          for i in $(seq 1 $MAX_RETRY); do
            echo "--- attempt $i/$MAX_RETRY ---"
            OUT=$(npx wrangler@3 deploy --config wrangler-ads.toml 2>&1) && RC=0 || RC=$?
            echo "$OUT"
            if [ $RC -eq 0 ]; then echo "✅ ur-ads 배포 성공 (attempt $i)"; exit 0; fi
            if echo "$OUT" | grep -q "Uploaded ur-ads"; then
              echo "::warning::스크립트 업로드 성공(부가 동기화만 실패) — 코드는 갱신됨."; exit 0
            fi
            [ $i -lt $MAX_RETRY ] && { echo "재시도 대기..."; sleep $((i*10)); }
          done
          echo "❌ ur-ads 배포 실패 (토큰 Workers Scripts:Edit 권한 / 번들 확인)"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
