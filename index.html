<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 🛡️ 2026-06-29 배포-청크 불일치 자동 복구 인라인 부트가드 (대표 신고 — 새 배포 후 도매몰 흰화면).
         캐시된/edge 옛 index.html 이 삭제된 app 청크(/assets/*.js·css)를 참조 → 404 → SPA fallback HTML →
         "Expected a JavaScript module script but server responded with text/html" → 앱 부팅 실패(흰화면).
         이 인라인 가드는 어떤 청크보다 먼저 실행 → 엔트리/코어 청크가 실패해도(번들 안 main.tsx 복구코드가
         로드조차 안 되는 닭/달걀 케이스) 동작한다. 모듈 스크립트 + modulepreload 리소스 로드 실패를 capture
         로 감지 → __cb 캐시버스트 + location.replace 로 옛 문서 재서빙(bfcache/edge) 우회(plain reload 는
         stale 재서빙 시 또 404 → 영구 흰화면이라 금지). main.tsx SSOT(reloadOnceForChunk)와 동일
         sessionStorage 키·윈도(60초 내 2회) 공유 → 이중카운트·무한 reload 없음. __cb 는 main.tsx 가 부팅 후 제거.
         ⚠️ 제3자/외부 스크립트는 /assets/ prefix 검사로 제외 → 불필요한 reload 0. -->
    <script>
      (function () {
        // 🛡️ 2026-07-20 (대표 신고 "새로고침 버튼 눌러도 계속 잘 안돼" — 고질적 문제 전수조사):
        //   복구 UI 가 왜 떴는지 진단 데이터를 남긴다. chunkSeen=진짜 청크404/MIME 확증, lastErr=마지막 에러
        //   메시지. 서빙 HTML 은 no-store(브라우저 stale 불가)라, 복구 UI 는 대부분 '느린/실패한 첫 마운트'
        //   워치독에서 뜨는데(캐시 문제 아님) 기존엔 무조건 "저장된 옛 버전" 오진 + __cb 캐시버스트만 반복해
        //   못 고치는 케이스가 루프에 갇혔다. 이제 원인을 서버(frontend_errors)로 beacon → 다음 발생 시 진짜
        //   원인 가시화(어드민 /api/_errors/recent). 부트가드는 엔트리 청크 실패 전 실행이라 self-contained.
        var lastErr = '';
        var chunkSeen = false;
        var reloadPending = false; // 🛡️ 재시도 유예(setTimeout) 중 다중 청크에러가 카운트를 소진하지 않게(재진입 가드).
        function beaconStuck(reason) {
          try {
            var t = 0;
            try { t = Math.round(window.performance && performance.now ? performance.now() : 0); } catch (e) {}
            // 엔트리 번들이 실행됐는지(=main.tsx 가 window.__urBootStarted 세팅). 안 돌았으면 청크404/CSP/네트워크,
            //   돌았으면 마운트가 느리거나 막힌 것(무거운 렌더/행/렌더에러) — 진짜 원인 구분의 핵심 신호.
            var bs = 0; try { bs = window.__urBootStarted || 0; } catch (e) {}
            var payload = JSON.stringify({
              message: '[boot-stuck] reason=' + reason + ' chunkSeen=' + chunkSeen + ' entryRan=' + (bs ? 'y' : 'n') + ' t=' + t + 'ms ready=' + (document.readyState || '?') + ' lastErr=' + String(lastErr || '(none)').slice(0, 240),
              url: location.pathname + location.search,
              type: 'manual',
              user_agent: navigator.userAgent
            });
            if (navigator.sendBeacon) { navigator.sendBeacon('/api/_errors/log', new Blob([payload], { type: 'application/json' })); }
            else if (window.fetch) { fetch('/api/_errors/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(function () {}); }
          } catch (e) { /* beacon 실패는 무시 — 진단은 best-effort */ }
        }
        function isAppChunk(t) {
          if (!t || t === window) return false;
          var url = t.src || t.href || '';
          return (t.tagName === 'SCRIPT' || t.tagName === 'LINK')
            && url.lastIndexOf(location.origin + '/assets/', 0) === 0
            && /\.(?:m?js|css)(?:[?#]|$)/.test(url);
        }
        // 🛡️ dynamic import() / modulepreload 실패의 브라우저별 메시지 변종(= chunk-error.ts isChunkLoadError SSOT 미러).
        //   React.lazy 청크 실패는 리소스 error 이벤트가 아니라 promise reject 로 옴 → unhandledrejection 도 감시해야 함.
        function isChunkMsg(m) {
          m = String(m || '').toLowerCase();
          return m.indexOf('failed to fetch dynamically imported module') >= 0
            || m.indexOf('error loading dynamically imported module') >= 0
            || m.indexOf('importing a module script failed') >= 0
            || m.indexOf('failed to load module script') >= 0
            || m.indexOf('expected a javascript') >= 0
            || m.indexOf('responded with a mime type') >= 0
            || m.indexOf('unable to preload css') >= 0;
        }
        // 🛡️ 2회 초과(진짜 stale 고착 — 예: 잔존 캐시-우선 SW 가 옛 문서 계속 서빙)면 무한 reload/무한로딩 대신
        //   정적 복구 화면을 띄운다 → 사용자가 절대 "응답 없는 페이지"/무한 스피너에 갇히지 않음(1클릭 완전복구).
        // 🛡️ 2026-07-20 (대표 신고 전수조사): 복구 UI 를 원인별로 구분 + 에스컬레이션 + 진단.
        //   reason='chunk' (진짜 청크404/MIME 확증) → 즉시 강한 복구(캐시/SW 완전삭제 + __cb).
        //   reason='slow'  (12s 워치독인데 청크 에러 증거 없음 = 네트워크 지연/느린 콜드스타트/결정적 에러) →
        //     ① 1단계: 부드러운 안내 + '다시 시도'(가벼운 __cb 캐시버스트만, 캐시 안 지움 — 오진 시 무해).
        //     ② 이미 이 세션에서 복구 UI 를 본 적 있으면(앞선 시도가 안 통함) 강한 복구로 자동 승격.
        //   기존엔 무조건 "저장된 옛 버전"(캐시 오진) + hardRecover 반복 → 캐시 문제 아닌 케이스가 루프.
        function showStuckUI(reason) {
          try {
            if (document.getElementById('ur-stuck-recover')) return;
            var shownBefore = false;
            try { shownBefore = sessionStorage.getItem('__ur_stuck_shown__') === '1'; sessionStorage.setItem('__ur_stuck_shown__', '1'); } catch (e) {}
            beaconStuck(reason || (chunkSeen ? 'chunk' : 'slow'));
            var hard = reason === 'chunk' || chunkSeen || shownBefore; // 확증된 청크 or 재발 → 완전복구
            var dark = false;
            try { dark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
            var bg = dark ? '#0F151D' : '#ffffff', fg = dark ? '#f5f5f5' : '#111827', sub = dark ? '#9ca3af' : '#6b7280';
            var title = hard ? '화면을 새로 불러올게요' : '불러오는 데 시간이 걸리고 있어요';
            var desc = hard
              ? '앱이 업데이트되는 중이에요. 잠시 뒤 자동으로 다시 시도합니다 — 바로 시도하려면 아래 버튼을 눌러주세요.'
              : '네트워크가 느리거나 일시적인 문제일 수 있어요. 잠시 뒤 자동으로 다시 시도하고, 계속 안 되면 캐시를 비워 복구할 수 있어요.';
            var primaryLabel = hard ? '최신 화면으로 새로고침' : '다시 시도';
            var d = document.createElement('div');
            d.id = 'ur-stuck-recover';
            d.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:' + bg + ';color:' + fg + ';font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif');
            var html = '<div style="font-weight:800;font-size:20px">' + title + '</div>'
              + '<div style="font-size:14px;line-height:1.6;color:' + sub + ';max-width:320px">' + desc + '</div>'
              + '<button id="ur-stuck-btn" style="margin-top:4px;padding:12px 28px;border:0;border-radius:999px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer">' + primaryLabel + '</button>';
            if (!hard) {
              html += '<button id="ur-stuck-hard" style="margin-top:2px;padding:6px 12px;border:0;background:none;color:' + sub + ';font-size:12px;text-decoration:underline;cursor:pointer">그래도 안 되면 · 캐시 비우고 복구</button>';
            }
            d.innerHTML = html;
            document.body.appendChild(d);
            var pb = document.getElementById('ur-stuck-btn');
            if (pb) pb.addEventListener('click', function () { if (hard) hardRecover(); else bustReload(); });
            var hb = document.getElementById('ur-stuck-hard');
            if (hb) hb.addEventListener('click', function () { hardRecover(); });
            // 🛡️ 2026-07-27 (대표 "복구 화면이 고객에게 드러나면 안돼"): 오버레이 자동 재시도 — 배포 전파 창
            //   클래스는 시간이 지나면 저절로 낫는다(대표 실측 "시간 지나니까 정상"). 사용자가 버튼을 안 눌러도
            //   30초 뒤 __cb reload 로 스스로 복구 시도(전파 완료 시점에 자동 정상화). 실패해도 다음 문서의
            //   오버레이가 다시 30초 타이머를 재장전 → 주기적 자동 치유(무한 고속 루프 아님 — 30s 간격).
            setTimeout(bustReload, 30000);
          } catch (e) { /* DOM 미준비 — 무시(리소스 error 는 body 이후) */ }
        }
        // 캐시버스트 reload — bfcache/heuristic/edge 의 옛 index.html 재서빙 우회(plain reload 는 stale 재서빙 시 또 404).
        function bustReload() {
          try { var u = new URL(location.href); u.searchParams.set('__cb', Date.now().toString(36)); location.replace(u.toString()); }
          catch (e) { try { location.reload(); } catch (_) {} }
        }
        // 완전복구: 잔존 SW unregister + 모든 캐시 삭제 후 캐시버스트 reload(수동 버튼 — 가드 카운트 무시).
        function hardRecover() {
          try { sessionStorage.removeItem('__ur_chunk_reload__'); } catch (e) {}
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) {
                var u = (r.active && r.active.scriptURL) || '';
                return u.indexOf('push-sw.js') >= 0 ? null : r.unregister();
              }));
            }).catch(function () {}));
            if ('caches' in window) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).catch(function () {}));
          } catch (e) {}
          Promise.all(jobs).then(bustReload, bustReload);
          setTimeout(bustReload, 1500); // SW/caches API 가 걸려도 최대 1.5s 뒤 강제 진행
        }
        function reloadOnce() {
          if (reloadPending) return; // 이미 재시도 예약됨 — 같은 버스트의 추가 청크에러는 무시(카운트 1회만).
          try {
            var KEY = '__ur_chunk_reload__', now = Date.now(), st = { n: 0, t: 0 };
            try { var raw = sessionStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') st = p; } } catch (e) { /* 옛 '1' 포맷 — 리셋 */ }
            var within = now - st.t < 300000;
            if (within && st.n >= 8) { showStuckUI('chunk'); return; } // 5분 내 8회 — stale 고착 → 무한 reload 대신 복구 UI
            var attempt = within ? st.n + 1 : 1;
            sessionStorage.setItem(KEY, JSON.stringify({ n: attempt, t: now }));
            // 🛡️ 2026-07-21 (대표 "배포해도 유저 불편"): 재시도 전 유예(배포 전파 대기).
            // 🛡️ 2026-07-27 (대표 "복구 화면이 고객에게 드러나면 안돼"): 전파 창이 '수초' 가정(0.7~2.5s×3회/90s)
            //   보다 실제(수십 초~수분)로 길어, 창 안에서 재시도 소진 → 오버레이 + 버튼도 창 안이라 무효 →
            //   시간 지나면 저절로 정상(= /admin/influencer-pool 실사례). **지수 백오프 8회/5분 창**(0.7→30s,
            //   누적 ~104s)으로 전파 창을 URDEAL 로더 상태로 통과 — 고객은 오버레이를 거의 못 봄.
            //   무한루프는 8회 캡이 여전히 차단. chunk-error.ts recoverFromChunkError 와 SSOT 미러(함께 갱신).
            reloadPending = true;
            var grace = Math.min(700 * Math.pow(2, attempt - 1), 30000);
            setTimeout(function () {
              try { var u = new URL(location.href); u.searchParams.set('__cb', Date.now().toString(36)); location.replace(u.toString()); }
              catch (e) { try { location.reload(); } catch (_) {} }
            }, grace);
          } catch (e) { try { location.reload(); } catch (_) { /* sessionStorage/location 차단 — silent */ } }
        }
        // 부팅 후 배선(main.tsx)·React ErrorBoundary 가 못 잡는 최악의 케이스(잔존 SW 고착)에서도 복구 UI 를 낼 수 있게 노출.
        window.__urShowStuckUI = showStuckUI;
        // 🛡️ 2026-07-16 (대표 신고 "새로고침 버튼 눌러도 한번에 안돼"): 슬로우 힌트(#ur-pre-react 8s 고착)의
        //   '↻ 새로고침'이 plain location.reload() 였음 — 옛 문서(bfcache/edge/heuristic·잔존 SW)를 그대로 재서빙 →
        //   또 고착 → 무한 반복(+ javascript: href 는 CSP 차단 가능). hardRecover(SW/캐시 삭제 + __cb 캐시버스트)를
        //   전역 노출해 그 버튼이 stuck-UI 버튼과 동일한 '1클릭 완전복구' 경로를 쓰게 한다.
        window.__urHardRecover = hardRecover;
        window.addEventListener('error', function (e) {
          if (isAppChunk(e && e.target)) { chunkSeen = true; try { lastErr = 'asset ' + ((e.target && (e.target.src || e.target.href)) || ''); } catch (x) {} reloadOnce(); return; } // app 청크(/assets/*.{js,css}) 리소스 실패
          if (e && isChunkMsg(e.message)) { chunkSeen = true; lastErr = String(e.message).slice(0, 240); reloadOnce(); return; } // 인라인 스크립트 파싱/모듈 에러 변종
          if (e && e.message) lastErr = String(e.message).slice(0, 240); // 비-청크 에러도 진단용 기록(마운트 못 하는 진짜 원인 포착)
        }, true); // capture: 리소스 로드 에러는 버블하지 않음
        window.addEventListener('unhandledrejection', function (e) {
          var m = e && e.reason && (e.reason.message || e.reason);
          if (isChunkMsg(m)) { chunkSeen = true; lastErr = String(m).slice(0, 240); reloadOnce(); } // React.lazy dynamic import reject
          else if (m) { try { lastErr = String(m).slice(0, 240); } catch (x) {} } // 진단용
        });
        // 🛡️ 2026-07-20 (전수조사): CSP 위반은 스크립트를 *조용히* 차단한다(error 이벤트 없음) → 엔트리 스크립트가
        //   CSP 로 막히면 'entry-stalled' 로만 보이고 원인이 안 남는다(캐시버스트로 절대 못 고치는 결정적 부류).
        //   securitypolicyviolation 을 잡아 차단 리소스를 lastErr 에 기록 → beacon → /admin/errors 에서 즉시 판별.
        window.addEventListener('securitypolicyviolation', function (e) {
          try {
            var uri = (e && (e.blockedURI || e.violatedDirective)) || '';
            lastErr = 'CSP ' + (e && e.effectiveDirective || e && e.violatedDirective || '') + ' blocked ' + String(uri).slice(0, 160);
            // 우리 앱 스크립트/청크가 CSP 로 막힌 거면 엔트리 실행 불능 = 진짜 stuck 원인 확증.
            if (isAppChunk({ tagName: 'SCRIPT', src: uri }) || /\/assets\//.test(String(uri))) chunkSeen = true;
          } catch (x) { /* 진단 실패 무시 */ }
        });
        // 🛡️ 잔존 캐시-우선 SW 조기 제거 — 옛 pwa-sw/sw 가 삭제된 청크를 서빙해 무한로딩/"응답없음"을 만드는 근본원인.
        //   어떤 앱 청크보다 먼저 실행 → main.tsx(엔트리 번들)가 SW 캐시에 막혀 못 도는 케이스도 커버. push-sw.js 만 보호.
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) {
                var u = (r.active && r.active.scriptURL) || (r.waiting && r.waiting.scriptURL) || '';
                if (u.indexOf('push-sw.js') < 0) { try { r.unregister(); } catch (e) {} }
              });
            }).catch(function () {});
          }
        } catch (e) {}
        // 🛡️ 2026-07-16 (대표 신고 "새로고침 버튼 눌러도 항상 한번에 새로고침이 안돼"): 워커가 #root 를 정적
        //   URDEAL 로더로 교체하므로(worker/index.ts urdealLoaderHtml) 기존 8초 슬로우힌트(#ur-pre-react/
        //   #ur-slow-hint — #root 안이라 미서빙)가 죽어 있었음 → 앱이 청크404/stale-SW/네트워크 행으로 안 뜨면
        //   로더가 무한 회전 + 화면 안 탈출구 0 → 사용자는 브라우저 새로고침(plain reload)만 → 또 stale 재서빙 →
        //   "한번에 새로고침 안됨". 서빙되는 이 부트가드에 워치독을 둬, 12초 뒤에도 앱이 안 떴으면(로더 그대로)
        //   showStuckUI(자체 fixed 오버레이 + hardRecover 1클릭 완전복구)를 띄운다. 앱이 늦게라도 뜨면
        //   main.tsx 가 오버레이를 제거(느린 회선 false-positive 자동 해제). 정상 부팅엔 no-op.

            //   유예가 12s 를 넘는 후반 시도에서 워치독이 끼어들어 '고객용 복구 화면'을 띄우던 것 차단(로더 유지).

            //   네트워크) / mount-slow(엔트리는 돌았는데 마운트 미완 = 무거운 렌더·행·렌더에러). 셋 다 gentle 1단계
            //   부터(=캐시 안 지움) — 청크 확증이나 세션 내 재발 시에만 showStuckUI 가 완전복구로 승격.

    <!-- 🛡️ FOUC 방지 — React 마운트 전 첫 페인트부터 올바른 테마 적용.
         정책 (CLAUDE.md A안):
           - localStorage 'dark' → 다크
           - localStorage 'light' → 라이트
           - localStorage 'system' or null (신규 사용자) → OS prefers-color-scheme 추적
         적용 범위: 화이트 테마 페이지 (쇼핑/결제) — dark: variants 활성/비활성.
         다크 페이지 (홈/마이/라이브) 는 bg-[#0F151D] 명시 강제라 토글 무영향. -->
    <script>
      (function () {
        var v = null;
        try { v = localStorage.getItem('ur_theme_mode_v1'); } catch (e) { /* private mode */ }
        if (!v) { try { v = sessionStorage.getItem('ur_theme_mode_v1'); } catch (e) { /* sandbox */ } }
        var sysDark = false;
        try { sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        // 🛡️ 2026-05-16: 신규 사용자 (v === null) default = light.
        //   기존 'system' 사용자만 OS 따라감. 'dark' 명시는 그대로.
        var dark = v === 'dark' || (v === 'system' && sysDark);
        try {
          if (dark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
        // 🛡️ 2026-05-04: body / pre-react 배경도 테마에 맞춰 즉시 설정 (FOUC 방지).
        window.__urInitialBg = dark ? '#0F151D' : '#ffffff';
        window.__urInitialFg = dark ? '#ffffff' : '#1d1d1f';
      })();

    <!--

      JS 작동: 카톡 detect 시 .show 클래스 토글 → 표시 + 자동 redirect 시도.

      현재: JS 가 ALL 환경에서 실행돼야 정상 동작 — 가장 확실한 흰화면 회피.

    <div id="ud-inapp-block" role="alert" aria-live="polite">

    <div id="root" role="application" aria-label="유어딜 라이브 커머스">

    <script>
      // 🛡️ 2026-04-28: 인앱 detect → 자동 redirect 1회 시도 (sessionStorage 가드).
      //   redirect 실패 시 → 풀스크린 block 안 띄우고 그대로 app 진입 (사용자 신고: '굳이 이럴 필요 있을까').
      //   App 안에 InAppBrowserBanner 가 상단에 작은 안내 배너로 표시됨 — 사용자가 dismiss 가능.
      //   JS 가 작동하면 redirect 시도, 작동 안 하면 root 의 placeholder 만 보임 (root 검정).
      //   document.write 사용 안 함 → 카톡 인앱 호환성 ↑.
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isKakao = /KAKAOTALK/i.test(ua);
          var isNaver = /NAVER\(inapp/i.test(ua);
          var isFB = /FB_IAB|FBAV|FBAN/i.test(ua);
          var isIG = /Instagram/i.test(ua);
          var isLine = /\bLine\//i.test(ua);
          var inApp = isKakao || isNaver || isFB || isIG || isLine;
          if (!inApp) {
            // 8초 후에도 placeholder 남으면 슬로우 힌트 표시 (일반 브라우저 전용)
            setTimeout(function() {
              var hint = document.getElementById('ur-slow-hint');
              if (hint && document.getElementById('ur-pre-react')) {
                hint.style.display = 'block';
                // 🛡️ 2026-07-16: '↻ 새로고침' → hardRecover(1클릭 완전복구). CSP-safe 이벤트 배선(inline onclick/
                //   javascript: href 대신 — stuck-btn 과 동일 패턴). 전역 미정의(엣지케이스) 시 plain reload 폴백.
                var rb = document.getElementById('ur-slow-reload');
                if (rb) rb.addEventListener('click', function () {
                  if (window.__urHardRecover) window.__urHardRecover(); else location.reload();
                });
              }
            }, 8000);
            return;
          }

          // 🛡️ 2026-07-25 (대표 지시 "카톡도 그냥 열리게"): 인앱 브라우저에서 외부 브라우저로
          //   자동 이동/팝업("외부 앱을 열려고 합니다")을 더 이상 시도하지 않음. 카카오톡 포함 모든
          //   인앱(카톡/인스타/페북/네이버/라인)은 앱을 그대로 렌더.
          //   React 쪽 autoRedirectKakaoToExternal 도 no-op 으로 정렬(SSOT).
          //   배경: 무한 reload 는 sessionStorage 가드로, 흰화면의 근본 원인이던 Service Worker 는
          //     2026-04-27 제거로 해소 + 부팅/청크 자가복구 견고화 → 강제 이동 불필요. 카카오 로그인은
          //     카톡 인앱(자체 세션) 안에서가 오히려 제일 잘 됨(App.tsx 2026-06-20 배너 제거 주석 참조).
          //   안내 배너(InAppBrowserBanner)도 2026-06-20 대표 요청으로 미마운트(노이즈) — 인앱에서 정말
          //     막히는 기능(충전/결제 등)은 기능 단위 게이트(IosTopupGate/InAppFeatureBlockedModal)가
          //     그 시점에만 외부 브라우저(openInExternalBrowser)를 안내.
          //   ⚠️ 회귀(카톡 흰화면) 시 롤백: git 이력에서 이 블록의 카톡 scheme 자동 이동 + REDIRECT_KEY
          //     가드 복원 + in-app-browser.ts autoRedirectKakaoToExternal 본문 복원(SSOT 쌍).
          //   (inApp 이면 위 8초 슬로우 힌트도 건너뜀 — 그대로 유지.)
        } catch (e) { /* never break the page */ }
      })();
    </script>
