<title>로딩 화면 시안</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root {
  --page: #F3F4F7; --page-fg: #16181C; --page-soft: #666C72; --page-rule: rgba(22,24,28,.1); --brand: #1C69EF;
  --font: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0B0D12; --page-fg: #F8F7FC; --page-soft: #9FA3A8; --page-rule: rgba(255,255,255,.1); color-scheme: dark } }
:root[data-theme="dark"] { --page: #0B0D12; --page-fg: #F8F7FC; --page-soft: #9FA3A8; --page-rule: rgba(255,255,255,.1); color-scheme: dark }
.scr {
  --bg: #FFFFFF; --sub: #F3F4F7; --ink: #16181C; --ink-soft: #666C72; --ink-faint: #81868C;
  --rule: rgba(22,24,28,.08); --rule-strong: rgba(22,24,28,.28); --brand-text: #1C69EF; --brand-tint: #EAF1FE; --star: #F5A524;
  --photo1: linear-gradient(135deg,#F2D9C9,#C9D8F2); --photo2: linear-gradient(135deg,#D3E8D6,#E9DCC6); --photo3: linear-gradient(135deg,#E6D3EB,#D0DEF0);
}
.scr[data-mode="dark"] {
  --bg: #11141C; --sub: #262A36; --ink: #F8F7FC; --ink-soft: #9FA3A8; --ink-faint: #6F747A;
  --rule: rgba(255,255,255,.08); --rule-strong: rgba(255,255,255,.32); --brand-text: #4D8DF5; --brand-tint: #16243D;
  --photo1: linear-gradient(135deg,#4A3729,#2B3A57); --photo2: linear-gradient(135deg,#2C4430,#4A3E2B); --photo3: linear-gradient(135deg,#40304A,#293A52);
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--page-fg); font-family: var(--font); margin: 0; }
button { font-family: var(--font); }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 16px; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
.lede { font-size: 15px; color: var(--page-soft); margin: 0 0 20px; line-height: 1.6; max-width: 66ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.ctl { font-weight: 500; font-size: 15px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--page-rule); background: transparent; color: var(--page-fg); cursor: pointer; }
.ctl.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.ctl:focus-visible, .scr button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.list { display: grid; gap: 40px; }
.item { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .item { grid-template-columns: 1fr; } }
.item h3 { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
.item h3 .n { color: var(--brand); margin-right: 6px; }
.item p { font-size: 13px; color: var(--page-soft); line-height: 1.65; margin: 0 0 8px; }
.item p b { color: var(--page-fg); font-weight: 500; }
.replay { margin-top: 4px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--page-rule); background: transparent; color: var(--page-fg); font-size: 13px; cursor: pointer; }
.scr { position: relative; height: 300px; border-radius: 22px; background: var(--bg); color: var(--ink); overflow: hidden; box-shadow: 0 0 0 1px var(--page-rule); font-size: 15px; }
.pad { padding: 16px; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.scr { height: 420px; }
.page { position: absolute; inset: 0; padding: 16px; }
.page .h { height: 22px; width: 60%; border-radius: 6px; background: var(--ink); opacity: .9; margin-bottom: 14px; }
.page .card { display: flex; gap: 12px; margin-bottom: 14px; }
.page .card .ph { width: 76px; height: 76px; border-radius: 12px; flex: none; }
.page .card .tx { flex: 1; padding-top: 6px; }
.page .card .tx i { display: block; height: 12px; border-radius: 6px; background: var(--sub); margin-bottom: 8px; }
.page .card .tx b { display: block; font-size: 15px; font-weight: 700; }
.page.in { animation: pin .28s cubic-bezier(.2,.9,.3,1); }
@keyframes pin { from { opacity: 0; transform: translateY(6px); } }
.cover { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 3; }
.hidden { display: none !important; }
.state { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--ink-faint); z-index: 5; }

/* 지금 */
.logo { font-size: 30px; font-weight: 800; letter-spacing: -.04em; color: var(--ink); }
.logo b { color: var(--brand-text); }
.breathe { animation: br 1.5s ease-in-out infinite; }
@keyframes br { 50% { transform: scale(.94); opacity: .6; } }
.udal { width: 56px; height: 56px; border-radius: 50%; background: #E9D7C3; animation: hop .7s ease-in-out infinite; display: grid; place-items: center; font-size: 12px; color: #6b5844; }
@keyframes hop { 50% { transform: translateY(-14px); } }
.track { width: 96px; height: 3px; border-radius: 2px; background: var(--sub); overflow: hidden; position: relative; }
.track i { position: absolute; inset: 0 auto 0 0; width: 38%; background: var(--brand); border-radius: 2px; animation: sw 1.15s ease-in-out infinite; }
@keyframes sw { from { transform: translateX(-100%); } to { transform: translateX(270%); } }

/* A 위쪽 막대 */
.topbar { position: absolute; top: 0; left: 0; height: 3px; background: var(--brand); width: 0; z-index: 4; box-shadow: 0 0 8px rgba(28,105,239,.5); }
.topbar.go { animation: tb 8s cubic-bezier(.08,.8,.2,1) forwards; }
@keyframes tb { 0% { width: 0; } 15% { width: 45%; } 100% { width: 92%; } }
.topbar.done { width: 100% !important; transition: width .2s ease, opacity .3s ease .2s; opacity: 0; animation: none; }
.dim { transition: opacity .2s ease .25s; }
.dim.on { opacity: .55; }

/* B 화면 모양 미리 */
.skel .ph, .skel .tx i, .skel .h { background: var(--sub) !important; position: relative; overflow: hidden; }
.skel .tx b { color: transparent; background: var(--sub); border-radius: 6px; width: 40%; }
.skel .ph::after, .skel .tx i::after, .skel .h::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: sh 1.1s ease-in-out infinite; }
[data-mode="dark"] .skel .ph::after, [data-mode="dark"] .skel .tx i::after, [data-mode="dark"] .skel .h::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
@keyframes sh { to { transform: translateX(100%); } }
.skel .h { opacity: 1; }

/* C 로고 점 */
.wm { font-size: 30px; font-weight: 800; letter-spacing: -.04em; color: var(--ink); display: flex; align-items: baseline; }
.wm .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); margin-left: 3px; animation: dot 1s cubic-bezier(.3,1.5,.5,1) infinite; }
@keyframes dot { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-14px) scale(.9); } 60% { transform: translateY(0) scale(1.25, .8); } }
.wm span { display: inline-block; animation: wl 1.6s ease-in-out infinite; }
@keyframes wl { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

/* D 차오르는 원 */
.ring { width: 44px; height: 44px; }
.ring circle { fill: none; stroke-width: 3.5; }
.ring .bg { stroke: var(--sub); }
.ring .fg { stroke: var(--brand); stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 113; transform: rotate(-90deg); transform-origin: center; animation: rg 6s cubic-bezier(.08,.8,.2,1) forwards; }
@keyframes rg { 15% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 10; } }
.cap { font-size: 13px; color: var(--ink-soft); }
.fadein { animation: fin .2s ease .25s backwards; }
@keyframes fin { from { opacity: 0; } }

.pick { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.pick button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--page-rule); background: transparent; color: var(--page-fg); font: 13px var(--font); cursor: pointer; }
.pick button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
@media (prefers-reduced-motion: reduce) { .scr *, .scr *::before, .scr *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
</style>

<div class="wrap">
  <h1>로딩 화면 시안</h1>
  <p class="lede">각 화면에서 "불러오기"를 누르면 로딩이 시작되고 잠시 뒤 내용이 떠요. 아래 버튼으로 <b>짧은 로딩(0.4초)</b>과 <b>긴 로딩(2.5초)</b>을 바꿔 볼 수 있어요. 빨라 보이는 데는 움직임보다 <b>무엇을 보여 주느냐</b>가 더 중요해서, 방식이 다른 네 가지를 골랐어요.</p>
  <div class="controls">
    <button class="ctl primary" id="all">전부 불러오기</button>
    <button class="ctl" id="len">긴 로딩(2.5초)으로</button>
    <button class="ctl" id="mode">다크 모드로 보기</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const $ = (s) => document.querySelector(s)
let LOAD = 400
const PH = ['var(--photo1)', 'var(--photo2)', 'var(--photo3)']
const pageHTML = (cls = '') => `<div class="page ${cls}"><div class="h"></div>${[0, 1, 2, 0].map((c, i) => `<div class="card"><div class="ph" style="background:${PH[c]}"></div><div class="tx"><i style="width:${80 - i * 8}%"></i><i style="width:${55 + i * 6}%"></i><b>${['8,900원', '19,000원', '98,000원', '24,000원'][i]}</b></div></div>`).join('')}</div>`
const V = [
  { id: 'now', t: '지금', d: '화면 전체를 흰 판으로 덮고, 유달이가 뛰고, 로고가 숨 쉬고, 막대가 왔다 갔다 해요. 아무리 짧은 로딩이어도 이 판이 한 번 번쩍 지나가서 <b>"멈췄다 → 기다린다"</b>로 느껴져요. 같은 동작이 반복되어 끝이 안 보이는 것도 느려 보이는 이유예요.',
    run(el, done) { const c = document.createElement('div'); c.className = 'cover'; c.innerHTML = '<div class="udal">유달이</div><div class="logo breathe">urdeal<b>.</b></div><div class="track"><i></i></div>'; el.appendChild(c); setTimeout(() => { c.remove(); done() }, LOAD) } },
  { id: 'A', t: 'A. 위쪽 얇은 막대 (추천)', d: '<b>보던 화면을 그대로 둔 채</b> 맨 위에 파란 막대만 차올라요. 처음엔 빨리 가다가 천천히, 끝나면 끝까지 쭉 채우고 사라져요. 유튜브·깃허브가 쓰는 방식이에요. 0.3초 안에 끝나면 막대도 거의 안 보여서, 짧은 로딩은 <b>아예 기다린 느낌이 없어요.</b> 오래 걸리면 화면이 살짝 흐려져 "가는 중"이라는 걸 알려 줘요.',
    run(el, done) { const b = document.createElement('div'); b.className = 'topbar'; el.appendChild(b); const pg = el.querySelector('.page'); requestAnimationFrame(() => b.classList.add('go')); const dimT = setTimeout(() => pg && pg.classList.add('dim', 'on'), 600)
      setTimeout(() => { clearTimeout(dimT); b.classList.add('done'); setTimeout(() => b.remove(), 600); done() }, LOAD) } },
  { id: 'B', t: 'B. 화면 모양 미리 보여 주기', d: '로딩 중에 <b>곧 나올 화면의 모양</b>(사진 칸·글자 줄)을 회색으로 먼저 깔고 빛이 한 번씩 훑고 지나가요. 내용이 그 자리에 그대로 채워져서 화면이 안 움직이고 빨라 보여요. 다만 화면마다 모양을 따로 만들어야 해서 손이 많이 가요.',
    run(el, done) { const s = document.createElement('div'); s.className = 'cover skel'; s.style.background = 'var(--bg)'; s.innerHTML = pageHTML(); el.appendChild(s); setTimeout(() => { s.remove(); done() }, LOAD) } },
  { id: 'C', t: 'C. 로고 점 하나만 통통', d: '유달이와 막대를 빼고 <b>로고 끝 파란 점 하나</b>만 통통 튀어요. 0.25초 안에 끝나는 로딩엔 아예 안 나타나요(번쩍임 없음). 지금 판보다 훨씬 가볍고 브랜드가 남아요. 화면 전체를 쓰는 첫 진입 로딩에 어울려요.',
    run(el, done) { let c = null; const t = setTimeout(() => { c = document.createElement('div'); c.className = 'cover fadein'; c.innerHTML = '<div class="wm"><span>urdeal</span><i class="dot"></i></div>'; el.appendChild(c) }, 250); setTimeout(() => { clearTimeout(t); c && c.remove(); done() }, LOAD) } },
  { id: 'D', t: 'D. 차오르는 원 + 한 줄', d: '같은 동작이 반복되는 대신 <b>원이 앞으로만 차올라요.</b> 끝을 향해 가는 게 보여서 같은 시간이라도 덜 지루해요. 결제 승인처럼 무엇을 기다리는지 말해 줘야 할 때 어울려요.',
    run(el, done) { let c = null; const t = setTimeout(() => { c = document.createElement('div'); c.className = 'cover fadein'; c.innerHTML = '<svg class="ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18"/></svg><div class="cap">결제 확인 중</div>'; el.appendChild(c) }, 250); setTimeout(() => { clearTimeout(t); c && c.remove(); done() }, LOAD) } },
]
$('#list').innerHTML = V.map((v) => `<div class="item"><div class="scr" id="L${v.id}">${pageHTML()}<div class="state" id="S${v.id}">불러온 화면</div></div><div><h3>${v.t}</h3><p>${v.d}</p><button class="replay" data-v="${v.id}">불러오기</button></div></div>`).join('')
function go(id) { const v = V.find((x) => x.id === id), el = $('#L' + id); el.querySelectorAll('.cover,.topbar').forEach((x) => x.remove()); const st = $('#S' + id); st.textContent = '불러오는 중…'
  let pg = el.querySelector('.page'); if (id !== 'A') { pg.style.visibility = 'hidden' }
  v.run(el, () => { const old = el.querySelector('.page'); const n = document.createElement('div'); n.innerHTML = pageHTML('in'); old.replaceWith(n.firstChild); st.textContent = '불러온 화면' }) }
document.querySelectorAll('.replay').forEach((b) => b.onclick = () => go(b.dataset.v))
$('#all').onclick = () => V.forEach((v) => go(v.id))
$('#len').onclick = () => { LOAD = LOAD === 400 ? 2500 : 400; $('#len').textContent = LOAD === 400 ? '긴 로딩(2.5초)으로' : '짧은 로딩(0.4초)으로' }
let dark = matchMedia('(prefers-color-scheme: dark)').matches
const applyMode = () => { document.querySelectorAll('.scr').forEach((s) => s.dataset.mode = dark ? 'dark' : 'light'); $('#mode').textContent = dark ? '라이트 모드로 보기' : '다크 모드로 보기' }
$('#mode').onclick = () => { dark = !dark; applyMode() }
applyMode()
</script>
