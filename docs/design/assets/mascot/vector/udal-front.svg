    <path d="M74 196 C52 199 30 204 10 212"/>
    <path d="M76 206 C58 214 40 224 22 236"/>
    <path d="M290 186 C312 183 334 183 356 186"/>
    <path d="M290 196 C312 199 334 204 354 212"/>
    <path d="M288 206 C306 214 324 224 342 236"/>
  </g>

  <!-- 반다나: 목 띠 + 앞 매듭 + 날개 둘 -->
  <path d="M90 262 C138 276 226 276 274 262 C276 276 268 290 252 294 C210 304 154 304 112 294 C96 290 88 276 90 262 Z" fill="url(#band)"/>
  <path d="M172 288 C150 296 130 314 128 334 C150 336 168 322 180 302 Z" fill="url(#band)"/>
  <path d="M192 288 C214 296 234 314 236 334 C214 336 196 322 184 302 Z" fill="url(#band)"/>
  <path d="M172 288 C150 296 130 314 128 334" fill="none" stroke="#1243A6" stroke-width="1.4"/>
  <path d="M192 288 C214 296 234 314 236 334" fill="none" stroke="#1243A6" stroke-width="1.4"/>
  <ellipse cx="182" cy="292" rx="16" ry="13" fill="#1C69EF"/>
  <ellipse cx="178" cy="288" rx="6" ry="4" fill="#5C95F5" opacity="0.7"/>
