  <ellipse cx="182" cy="378" rx="74" ry="100" fill="url(#cream)"/>

  <!-- 팔 -->
  <path d="M84 284 C58 300 40 338 38 370 C36 394 62 400 72 386 C80 366 88 340 102 316 Z" fill="url(#fur)" stroke="#7A5640" stroke-width="1.5"/>
  <path d="M280 284 C306 300 324 338 326 370 C328 394 302 400 292 386 C284 366 276 340 262 316 Z" fill="url(#fur)" stroke="#7A5640" stroke-width="1.5"/>

