<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 10 356 262" width="356" height="262">
  <title>유달이 얼굴 (벡터 정본 v1 — 스티커·아이콘용)</title>
  <defs>
    <radialGradient id="fur" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#B98A67"/>
      <stop offset="0.6" stop-color="#9D7256"/>
      <stop offset="1" stop-color="#7E5A43"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#F3E6D6"/>
      <stop offset="1" stop-color="#DCC6AE"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#120B08"/>
      <stop offset="0.62" stop-color="#22140E"/>
      <stop offset="1" stop-color="#7A4528"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EBA594" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#EBA594" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7BF2"/>
      <stop offset="1" stop-color="#1550C0"/>
    </linearGradient>
    <clipPath id="headClip"><path d="M182 18 C246 18 306 54 324 118 C344 196 300 264 182 268 C64 264 20 196 40 118 C58 54 118 18 182 18 Z"/></clipPath>
  </defs>

  <!-- 귀 -->
  <circle cx="42" cy="110" r="25" fill="#8C6449"/>
  <circle cx="44" cy="112" r="13" fill="#5A3A2A"/>
  <circle cx="322" cy="110" r="25" fill="#8C6449"/>
  <circle cx="320" cy="112" r="13" fill="#5A3A2A"/>

  <!-- 머리 -->
  <path d="M182 18 C246 18 306 54 324 118 C344 196 300 264 182 268 C64 264 20 196 40 118 C58 54 118 18 182 18 Z" fill="url(#fur)"/>
  <!-- 얼굴 아래 크림 마스크 -->
  <g clip-path="url(#headClip)"><path d="M10 172 C40 152 104 168 134 170 C152 170 160 156 182 156 C204 156 212 170 230 170 C260 168 324 152 354 172 L354 300 L10 300 Z" fill="url(#cream)"/></g>

  <!-- 볼 홍조 -->
  <ellipse cx="86" cy="200" rx="26" ry="18" fill="url(#blush)"/>
  <ellipse cx="278" cy="200" rx="26" ry="18" fill="url(#blush)"/>

  <!-- 눈썹 (콩 모양 아치) -->
  <ellipse cx="110" cy="80" rx="23" ry="10.5" transform="rotate(-8 110 80)" fill="#F1E3D3"/>
  <ellipse cx="254" cy="80" rx="23" ry="10.5" transform="rotate(8 254 80)" fill="#F1E3D3"/>

  <!-- 눈: 흰자 고리 + 홍채 + 하이라이트 2 -->
  <circle cx="112" cy="150" r="32" fill="#FBF7F2"/>
  <circle cx="113" cy="151" r="28.5" fill="url(#eye)"/>
  <circle cx="122" cy="140" r="9" fill="#FFFFFF"/>
  <circle cx="104" cy="161" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="252" cy="150" r="32" fill="#FBF7F2"/>
  <circle cx="251" cy="151" r="28.5" fill="url(#eye)"/>
  <circle cx="260" cy="140" r="9" fill="#FFFFFF"/>
  <circle cx="242" cy="161" r="3.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- 코 (가로가 넓은 연어색) -->
  <path d="M163 166 C163 158 201 158 201 166 C201 178 189 185 182 185 C175 185 163 178 163 166 Z" fill="#CC7F6C"/>
  <ellipse cx="176" cy="165" rx="6" ry="3" fill="#F2B7A8" opacity="0.8"/>

  <!-- 입 (다문 w) -->
  <path d="M182 186 L182 192 M158 192 C166 206 178 205 182 194 C186 205 198 206 206 192" fill="none" stroke="#5A3A2A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 수염 한쪽 3가닥 -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M74 186 C52 183 30 183 8 186"/>
    <path d="M74 196 C52 199 30 204 10 212"/>
    <path d="M76 206 C58 214 40 224 22 236"/>
    <path d="M290 186 C312 183 334 183 356 186"/>
    <path d="M290 196 C312 199 334 204 354 212"/>
    <path d="M288 206 C306 214 324 224 342 236"/>
  </g>

</svg>
