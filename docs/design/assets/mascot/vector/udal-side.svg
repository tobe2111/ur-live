<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 519" width="364" height="519">
  <title>유달이 옆모습 (벡터 정본 v1 — 오른쪽을 본다)</title>
  <defs>
    <radialGradient id="fur" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#B98A67"/>
      <stop offset="0.6" stop-color="#9D7256"/>
      <stop offset="1" stop-color="#7E5A43"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#F3E6D6"/>
      <stop offset="1" stop-color="#DCC6AE"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#120B08"/>
      <stop offset="0.62" stop-color="#22140E"/>
      <stop offset="1" stop-color="#7A4528"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EBA594" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#EBA594" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7BF2"/>
      <stop offset="1" stop-color="#1550C0"/>
    </linearGradient>
    <clipPath id="sideHeadClip"><path d="M196 18 C262 18 312 62 322 120 C342 140 344 184 318 204 C298 246 250 262 196 262 C126 262 72 214 72 140 C72 72 126 18 196 18 Z"/></clipPath>
  </defs>

  <!-- 꼬리 (뒤로 길게, 끝이 가늘다) -->
  <path d="M156 396 C110 404 50 414 24 432 C12 444 24 458 46 456 C86 454 128 464 164 474 Z" fill="url(#fur)" stroke="#7A5640" stroke-width="1.2"/>

  <!-- 뒷발 · 앞발 -->
  <ellipse cx="172" cy="484" rx="34" ry="16" fill="#8C6449"/>
  <ellipse cx="226" cy="486" rx="40" ry="18" fill="url(#fur)"/>

  <!-- 몸통 (등은 왼쪽 둥근 곡선, 배는 오른쪽) -->
  <path d="M146 240 C116 280 108 360 120 430 C130 476 170 494 214 494 C262 494 294 466 296 414 C300 346 282 284 254 244 Z" fill="url(#fur)"/>
  <!-- 배 (앞쪽에만 보이는 크림) -->
  <path d="M242 280 C274 316 294 376 288 428 C284 462 266 482 244 486 C254 440 254 360 228 290 Z" fill="url(#cream)"/>

  <!-- 귀 (옆머리 위쪽) -->

  <!-- 머리 -->
  <path d="M196 18 C262 18 312 62 322 120 C342 140 344 184 318 204 C298 246 250 262 196 262 C126 262 72 214 72 140 C72 72 126 18 196 18 Z" fill="url(#fur)"/>
  <!-- 얼굴 앞쪽 아래 크림 (주둥이·볼·턱) -->
  <g clip-path="url(#sideHeadClip)"><path d="M186 186 C206 166 252 166 274 158 C292 152 306 150 344 150 L344 300 L180 300 C176 254 176 210 186 186 Z" fill="url(#cream)"/></g>
  <circle cx="160" cy="106" r="21" fill="#8C6449" stroke="#6E4D39" stroke-width="2"/>
  <path d="M168 94 C156 96 152 116 166 120" fill="none" stroke="#5A3A2A" stroke-width="5" stroke-linecap="round"/>

  <!-- 볼 홍조 -->
  <ellipse cx="258" cy="196" rx="24" ry="16" fill="url(#blush)"/>

  <!-- 눈썹 (콩 모양) -->
  <ellipse cx="276" cy="80" rx="16" ry="9" transform="rotate(-14 276 80)" fill="#F1E3D3"/>

  <!-- 눈 (옆에서 본 타원) -->
  <ellipse cx="286" cy="144" rx="19" ry="27" fill="#FBF7F2"/>
  <ellipse cx="290" cy="145" rx="15" ry="23" fill="url(#eye)"/>
  <ellipse cx="295" cy="134" rx="5" ry="7" fill="#FFFFFF"/>
  <circle cx="285" cy="157" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- 코 -->
  <path d="M322 156 C334 156 342 162 340 170 C338 178 328 180 320 176 C314 172 314 158 322 156 Z" fill="#CC7F6C"/>
  <!-- 입 -->
  <path d="M318 184 C314 194 302 198 294 194" fill="none" stroke="#5A3A2A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 수염 한쪽 3가닥 (보이는 쪽) -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M296 182 C276 178 256 178 236 182"/>
    <path d="M296 188 C276 192 258 198 240 206"/>
    <path d="M298 194 C282 204 268 214 254 226"/>
  </g>

  <!-- 팔 (옆구리에 내려옴) -->
  <path d="M196 284 C214 296 224 330 224 358 C224 384 204 392 194 378 C188 352 186 318 180 296 Z" fill="url(#fur)" stroke="#7A5640" stroke-width="1.5"/>

  <!-- 반다나: 목 띠 + 앞쪽 매듭 -->
  <path d="M136 252 C180 270 236 276 284 262 C290 276 284 292 268 296 C224 302 170 292 136 276 Z" fill="url(#band)"/>
  <path d="M262 288 C270 302 274 318 272 332 C262 330 254 316 252 300 Z" fill="url(#band)"/>
  <path d="M274 286 C288 296 296 312 294 328 C284 324 276 310 272 296 Z" fill="url(#band)"/>
  <ellipse cx="268" cy="290" rx="11" ry="10" fill="#1C69EF"/>
</svg>
